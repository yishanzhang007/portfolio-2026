<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Option 3 v3 · Conditional Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Design tokens — matched to Figma file bOs3XqV09MMe9gNXVb1Hkf */
      --fg-primary: #21201d;
      --fg-secondary: #8E8C88;
      --fg-tertiary: #8e8c88;
      --fg-disabled: #bcbbb7;
      --fg-link: #1260c6;
      --bg-surface-primary: #ffffff;
      --bg-surface-secondary: #f8f8f7;
      --dropdown-selected-bg: #F2F2F0;
      --bg-inverted: #32302c;
      --fg-inverted: #fcfcfc;
      --border-default: rgba(33, 32, 29, 0.2);
      --connector-color: #D3D2D2;
      --node-border-color: var(--connector-color);
      --node-border-hover-color: #A09F9F;
      --border-header: rgba(33, 32, 29, 0.15);
      --editor-border-color: rgba(33, 32, 29, 0.10);
      --editor-border: 1px solid var(--editor-border-color);
      --neutral-10: #82807c;
      --muted: #8e8c88;
      --font-stack: 'Inter', system-ui, sans-serif;
      --button-height: 32px;
      --button-padding-x: 10px;
      --button-font-weight: 500;
      --button-radius: 12px;
      --dropdown-hover-bg: var(--bg-surface-secondary);
      --dropdown-row-radius: 10px;
      --node-card-height: 60px;
      --intent-row-gap: 104px;
    }
    body { font-family: var(--font-stack); font-weight: 400; }
    *, input, textarea, select, button { font-family: var(--font-stack); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    input, textarea, select { font-weight: 400; }
    .text-stone-500 { color: var(--fg-secondary) !important; }
	    button {
      font-weight: var(--button-font-weight);
      border-radius: 8px !important;
    }
	    svg[stroke] *,
	    svg [stroke] {
	      vector-effect: non-scaling-stroke;
	    }
	    button:not(.add-intent-trigger) {
      box-sizing: border-box !important;
      min-height: var(--button-height) !important;
      height: var(--button-height) !important;
      padding-left: var(--button-padding-x) !important;
      padding-right: var(--button-padding-x) !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }
    #add-intake-trigger {
      min-height: 0 !important;
      height: auto !important;
      padding: 0 !important;
    }
    #preview-close,
    #panel-close,
    #panel-more {
      width: 32px !important;
      padding: 0 !important;
    }
    button * { font-weight: inherit; }
    textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
    textarea::-webkit-input-placeholder, input::-webkit-input-placeholder { color: var(--muted); opacity: 1; }
    textarea::-moz-placeholder, input::-moz-placeholder { color: var(--muted); opacity: 1; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #e7e5e4; border-radius: 3px; }
    .app-shell { background: var(--bg-surface-primary); }
    .app-nav {
      width: 56px;
      background: var(--bg-surface-secondary);
      color: var(--fg-primary);
      padding: 20px 12px;
    }
    .nav-logo-mark {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-link {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: var(--fg-secondary);
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    .nav-link:hover { background: rgba(33,32,29,0.05); color: var(--fg-primary); }
    .nav-link[aria-current="page"] {
      background: #e9e8e6;
      color: var(--fg-primary);
    }
    .nav-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: currentColor;
    }
    .top-icon-button {
      border: 0.5px solid transparent;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .top-icon-button:hover {
      background: var(--bg-surface-secondary);
      border-color: var(--border-header);
    }
    #mode-trigger:hover {
      border-color: transparent;
    }
    #preview-btn:hover {
      border-color: transparent;
    }
    #publish-btn {
      padding-left: calc(var(--button-padding-x) + 2px) !important;
      padding-right: calc(var(--button-padding-x) + 2px) !important;
    }
    .preview-icon path {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    #preview-btn:hover .preview-icon path,
    #preview-btn:focus-visible .preview-icon path,
    #panel-preview-btn:hover .preview-icon path,
    #panel-preview-btn:focus-visible .preview-icon path {
      animation: previewWavePulse 840ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #preview-btn:hover .preview-icon path:nth-child(1),
    #preview-btn:focus-visible .preview-icon path:nth-child(1),
    #panel-preview-btn:hover .preview-icon path:nth-child(1),
    #panel-preview-btn:focus-visible .preview-icon path:nth-child(1) {
      animation-delay: 0ms;
    }
    #preview-btn:hover .preview-icon path:nth-child(2),
    #preview-btn:focus-visible .preview-icon path:nth-child(2),
    #panel-preview-btn:hover .preview-icon path:nth-child(2),
    #panel-preview-btn:focus-visible .preview-icon path:nth-child(2) {
      animation-delay: 42ms;
    }
    #preview-btn:hover .preview-icon path:nth-child(3),
    #preview-btn:focus-visible .preview-icon path:nth-child(3),
    #panel-preview-btn:hover .preview-icon path:nth-child(3),
    #panel-preview-btn:focus-visible .preview-icon path:nth-child(3) {
      animation-delay: 84ms;
    }
    #preview-btn:hover .preview-icon path:nth-child(4),
    #preview-btn:focus-visible .preview-icon path:nth-child(4),
    #panel-preview-btn:hover .preview-icon path:nth-child(4),
    #panel-preview-btn:focus-visible .preview-icon path:nth-child(4) {
      animation-delay: 126ms;
    }
    #preview-btn:hover .preview-icon path:nth-child(5),
    #preview-btn:focus-visible .preview-icon path:nth-child(5),
    #panel-preview-btn:hover .preview-icon path:nth-child(5),
    #panel-preview-btn:focus-visible .preview-icon path:nth-child(5) {
      animation-delay: 168ms;
    }
    @keyframes previewWavePulse {
      0%, 100% { transform: translateY(0) scaleY(1); }
      28% { transform: translateY(0.48px) scaleY(0.8656); }
      54% { transform: translateY(-0.48px) scaleY(1.1344); }
    }
    @media (prefers-reduced-motion: reduce) {
      .preview-icon path {
        animation: none !important;
        transform: none !important;
      }
    }
    #mode-menu button {
      height: auto !important;
      min-height: 0 !important;
      padding-top: 4px !important;
      padding-bottom: 4px !important;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: #fff !important;
      background-image: none !important;
    }
    #mode-menu,
    #mode-options,
    #mode-menu > div {
      background: #fff !important;
    }
    #mode-menu .mode-option {
      align-items: center;
      min-height: 44px !important;
      padding: 8px 12px !important;
      border-radius: var(--dropdown-row-radius) !important;
      font-weight: 400 !important;
      background: #fff !important;
      background-image: none !important;
    }
    #mode-menu .mode-option:hover,
    #mode-menu #add-time-block:hover {
      background: var(--dropdown-hover-bg) !important;
    }
    #mode-menu .mode-option.is-selected,
    #mode-menu .mode-option.is-selected:hover {
      background: var(--dropdown-selected-bg) !important;
      font-weight: 500 !important;
    }
    #mode-menu #add-time-block {
      margin-top: 4px;
      padding: 8px 12px 8px 8px !important;
      border-radius: var(--dropdown-row-radius) !important;
      font-weight: 400 !important;
      background: #fff !important;
      background-image: none !important;
    }
    #mode-menu .mode-status {
      font-size: 11px;
      line-height: 16px;
      font-weight: 400;
      color: var(--fg-tertiary);
      flex: 0 0 auto;
    }
    #mode-menu .mode-status.is-live {
      color: #177E1D;
    }
    .nav-link:focus,
    .top-icon-button:focus {
      outline: none;
    }
    .nav-link:focus-visible,
    .top-icon-button:focus-visible {
      box-shadow: 0 0 0 2px rgba(18, 96, 198, 0.14);
    }
    .secondary-button {
      background: var(--bg-surface-primary);
      border: var(--editor-border);
      color: var(--fg-primary);
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, color 140ms ease;
    }
    .secondary-button:hover:not(:disabled) {
      background: var(--bg-surface-secondary);
    }
    .secondary-button:focus { outline: none; }
    .secondary-button:focus-visible {
      box-shadow: 0 0 0 2px rgba(18, 96, 198, 0.14);
    }
    .secondary-button:disabled {
      color: var(--fg-disabled);
      cursor: not-allowed;
    }
    .tertiary-button {
      background: transparent;
      border: 0;
      color: var(--fg-primary);
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    .tertiary-button:hover:not(:disabled) {
      background: var(--bg-surface-secondary);
    }
    .tertiary-button:focus { outline: none; }
    .tertiary-button:focus-visible {
      box-shadow: 0 0 0 2px rgba(18, 96, 198, 0.14);
    }
    .tertiary-button:disabled {
      color: var(--fg-disabled);
      cursor: not-allowed;
    }
    .flow-node { cursor: pointer; }
    .flow-node.firing .card-shell { animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 0 0 3px #fbbf24, 0 8px 24px -8px rgba(0,0,0,0.2); }
    @keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }

    /* Card UI — matches Figma 6483-2594 */
    .card-shell {
      display: flex;
      gap: 10px;
      align-items: center;
	      padding: 12px 16px 12px 12px;
	      width: 216px;
      min-height: var(--node-card-height);
	      border-radius: 20px;
	      border: 0.5px solid var(--node-border-color);
	      background: #ffffff;
	      position: relative;
	      isolation: isolate;
      box-shadow: none;
      transform: translateY(0) scale(1);
      transition:
	        background-color 160ms ease,
	        border-color 160ms ease,
	        border-radius 160ms ease,
        box-shadow 160ms ease,
        transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-shell::after {
      content: "";
      position: absolute;
      inset: -4px;
      z-index: 0;
      border-radius: 20px;
      border: 1px solid color-mix(in srgb, var(--node-accent, #6a3cdf) 20%, transparent);
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    .card-shell > * {
      position: relative;
      z-index: 1;
    }
    .intent-card-shell {
      width: 240px;
      height: var(--node-card-height);
    }
    .card-shell.no-bg { background: #ffffff; }
    .flow-node:hover .card-shell,
    .card-shell.is-selected {
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .flow-node:hover .card-shell {
      transform: translateX(0) scale(1);
      border-color: var(--node-border-hover-color);
    }
    .card-shell.is-selected {
      transition: none;
    }
    .card-shell.is-selected .card-icon {
      border-width: 0.5px;
      border-color: transparent !important;
    }
    /* Start (Incoming call) node — non-interactive chip */
    .start-node { cursor: default; }
    .start-node:hover .card-shell { background: #ffffff !important; box-shadow: none !important; }
    .start-node:hover .card-icon {
      border-width: 0.5px;
      border-color: rgba(102,101,97,0.30) !important;
      box-shadow: 0 2px 8px color-mix(in srgb, currentColor 10%, transparent);
      transform: translateY(0) rotate(-4deg);
    }
    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 0.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform: translateY(0) rotate(0deg);
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .flow-node:hover .card-icon {
      transform: translateY(0) rotate(-4deg);
      border-width: 0.5px;
      border-color: var(--icon-border-hover, color-mix(in srgb, currentColor 30%, transparent)) !important;
      box-shadow: 0 2px 8px color-mix(in srgb, currentColor 10%, transparent);
    }
    .flow-node .card-shell.is-selected .card-icon {
      border-width: 0.5px;
      border-color: transparent !important;
    }
    .flow-node:hover .card-shell.is-selected .card-icon {
      border-width: 0.5px;
      border-color: var(--icon-border-hover, color-mix(in srgb, currentColor 30%, transparent)) !important;
      box-shadow: 0 2px 8px color-mix(in srgb, currentColor 10%, transparent);
      transform: translateY(0) rotate(-4deg);
    }
    .card-icon svg { width: 20px; height: 20px; }
    #canvas-nodes .card-icon svg,
    #canvas-nodes .card-icon svg * {
      stroke-width: 1 !important;
    }
    #canvas-svg .connection-path {
      transition: stroke 150ms ease, stroke-width 150ms ease, opacity 150ms ease;
      vector-effect: non-scaling-stroke;
    }
    .card-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      min-width: 0;
      position: relative;
    }
    .card-title-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .card-title {
      font-size: 14px;
      line-height: 16px;
      color: #21201d;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .flow-node[data-node-id^="intent-"] .card-title {
      font-weight: 400;
    }
    .start-node .card-title,
    .flow-node[data-node-id="welcome"] .card-title {
      font-weight: 400;
    }
    .card-action-label {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-size: 14px;
      line-height: 16px;
      color: var(--fg-primary);
      font-weight: 400;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .card-action-label span {
      transition: color 160ms ease;
    }
    .card-title.title-accent-schedule { color: #2972c3; }
    .card-title.title-accent-message  { color: #6a3cdf; }
    .card-title.title-accent-transfer { color: #0A7C2E; }
    .card-subtitle {
      font-size: 12px;
      line-height: 16px;
      color: var(--fg-secondary);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .card-subtitle-edited-field {
      position: relative;
      display: inline-flex;
      text-decoration: none;
      cursor: default;
      outline: none;
    }
    .card-dot {
      display: none;
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #177E1D;
      top: 8px;
      left: 43px;
      box-shadow: 0 0 0 2px white;
    }
    .intent-card-dot { top: 11px; }
    /* Add-intent button — same card-shell hover treatment, but visually distinct muted icon */
    .add-intent-trigger {
      display: block;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
    }
    .add-intent-trigger .card-icon {
      border-style: solid;
      border-width: 0.5px;
      color: var(--fg-secondary);
      border-color: rgba(33,32,29,0.10);
      background: transparent;
      transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), background-color 160ms ease;
    }
    .add-intent-trigger .card-title { color: var(--fg-secondary); font-weight: 400; transition: color 160ms ease; }
    .add-intent-trigger:hover .card-icon {
      border-color: rgba(33,32,29,0.30) !important;
      color: var(--fg-primary);
      background: transparent;
      box-shadow: 0 2px 8px rgba(33,32,29,0.10);
      transform: translateY(0) rotate(-4deg);
    }
    .add-intent-trigger:hover .card-title { color: var(--fg-primary); }
    .add-intent-trigger .card-shell {
      border: 0.5px solid transparent;
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 120ms ease; }
    .side-panel,
    .preview-panel {
      --panel-hidden-offset: 48px;
      visibility: visible;
      transform: translateX(0);
      transition:
        right 240ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 180ms ease,
        visibility 0s linear 0s !important;
      will-change: transform;
    }
    .side-panel.hidden,
    .preview-panel.hidden {
      display: flex !important;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(calc(100% + var(--panel-hidden-offset)));
      transition:
        right 240ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 180ms ease,
        visibility 0s linear 240ms !important;
    }
    #panel-stack-shadow {
      position: fixed;
      top: 8px;
      right: 8px;
      bottom: 8px;
      width: 800px;
      border-radius: 16px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.04);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(24px);
      transition:
        opacity 180ms ease,
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 240ms;
      z-index: 38;
    }
    #panel-stack-shadow.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition:
        opacity 180ms ease,
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }
    #panel-title { column-gap: 8px; }
#panel-intent-name {
      flex: 0 0 auto;
      width: max-content;
      height: 28px !important;
      min-height: 28px !important;
      max-height: 28px !important;
      padding-left: 8px !important;
      padding-right: 8px !important;
      border-radius: 8px !important;
      background: var(--panel-intent-bg, #FAFAF9) !important;
      color: var(--panel-intent-color, var(--fg-secondary)) !important;
      font-size: 12px !important;
      line-height: 16px !important;
      font-weight: 500 !important;
    }
#panel-action-trigger {
      flex: 0 0 auto;
      width: max-content;
      height: 28px !important;
      min-height: 28px !important;
      max-height: 28px !important;
      margin-left: 0;
      padding-left: 6px !important;
      padding-right: 8px !important;
      border-radius: 8px !important;
      background: var(--panel-action-bg, #FAFAF9) !important;
      font-size: 12px !important;
      line-height: 16px !important;
      font-weight: 500 !important;
      gap: 4px !important;
    }
    #panel-action-label {
      font-size: 12px !important;
      line-height: 16px !important;
      font-weight: 500 !important;
    }
    #panel-action-trigger:hover {
      background: var(--panel-action-hover-bg, #FAFAF9) !important;
    }
    #panel-action-icon {
      display: inline-flex !important;
      width: 18px !important;
      height: 18px !important;
      color: currentColor;
    }
    #panel-action-icon svg {
      width: 18px !important;
      height: 18px !important;
    }
    #panel-action-menu .action-menu-icon {
      width: 18px !important;
      height: 18px !important;
    }
    #panel-action-menu .action-menu-icon svg {
      width: 18px !important;
      height: 18px !important;
    }
    #panel-action-menu .action-menu-option {
      height: auto !important;
      min-height: 32px !important;
      max-height: none !important;
      padding: 6px 12px !important;
      padding-left: 6px !important;
      gap: 6px !important;
    }
    #panel-title-dot {
      display: none !important;
    }
    #panel-title-dot {
      width: 2px;
      height: 2px;
      border-radius: var(--button-radius);
      background: var(--fg-secondary);
      flex: 0 0 auto;
    }

    /* Custom checkbox — matches Figma: 16px filled dark square with white check */
    .intake-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: var(--editor-border);
      border-radius: 6px;
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
      flex-shrink: 0;
    }
    .intake-checkbox:hover:not(:disabled) { border-color: var(--editor-border-color); }
    .intake-checkbox:checked {
      background-color: transparent;
      border-color: transparent;
      background-image: url("icons/input-checkbox.svg");
      background-size: 16px 16px;
      background-position: center;
      background-repeat: no-repeat;
    }
    .intake-checkbox:disabled { cursor: not-allowed; opacity: 0.6; }
    .test-drawer { transition: transform 0.25s ease, right 0.2s ease; }
    .test-drawer.collapsed { transform: translateY(calc(100% - 56px)); }
    .action-option { transition: all 0.12s; }
    .action-option:hover { background: #f5f5f4; }
    .action-option.selected { background: #1c1917; color: white; }
    .action-option.selected .opt-icon { background: rgba(255,255,255,0.1); }
    .action-option.selected .opt-desc { color: rgba(255,255,255,0.7); }
    /* Dropdown entrance — user-initiated, ease-out for a snappy settle */
    .add-dropdown {
      animation: dropIn 180ms cubic-bezier(0.215, 0.61, 0.355, 1);
      transform-origin: top left;
      padding: 4px;
      border-radius: 14px !important;
      position: absolute !important;
    }
    #panel-action-menu,
    #panel-more-menu {
      padding: 4px;
      border: var(--editor-border) !important;
      border-radius: 14px !important;
      position: absolute !important;
    }
    #panel-action-menu {
      width: 224px !important;
      min-width: 224px !important;
    }
    .add-dropdown::before,

  <script>
    const ACTION_KINDS = {
      message:  { label: 'Take a message',  headerLabel: 'AI call',   desc: 'Capture the caller’s request and route to the right inbox', iconSvg: 'envelopeOpen', iconColor: '#6a3cdf' },
      transfer: { label: 'Transfer call',   headerLabel: 'Transfer',  desc: 'Hand the caller to a phone number',                          iconSvg: 'phone',        iconColor: '#0A7C2E' },
      // Schedule kept for backwards-compat with older saved intents but hidden from the picker
      // (requires EHR integration we don't ship in v1).
      schedule: { label: 'Schedule appointment', headerLabel: 'Schedule', desc: 'Book directly into the EHR', iconSvg: 'lightning', iconColor: '#2972c3', requiresEhr: true, hidden: true },
    };

    // EHR integration gate — when off, Schedule is disabled
    const EHR_INTEGRATION_ENABLED = true;

    // Inbox keys mirror PrimaryInboxSchema in
    // server/api/src/modules/conversation/conversation.types.ts:121
    const INBOX_LABELS = {
      front_desk:    'Front desk',
      billing:       'Billing',
      clinical_team: 'Clinical team',
    };
    const inboxLabel = (key) => INBOX_LABELS[key] || key || 'Front desk';

    // Upper bound on the free-text instructions a clinic can write per intent.
    // Telemetry hook: log per-clinic prompt length distribution + frequency of edits.
    const PROMPT_LIMIT = 500;
    const LEGACY_MEDICAL_PROMPT = 'For medication questions, do not provide medical advice, dosing changes, or safety judgments. Collect the medication name, dose, if known, pharmacy, refill timing, symptoms or concerns, and best callback number. If the caller reports severe reaction, chest pain, trouble breathing, fainting, or suicidal thoughts, advise them to call 911 or go to the ER. For refill requests, route to Clinical inbox.';
    const LEGACY_DEFAULT_PROMPTS = new Set([
      LEGACY_MEDICAL_PROMPT,
      'Collect: caller name, account/MRN if they have it, callback number, and a brief description of the billing question.',
      'Take down the caller name, callback number, and what they need.',
      'Note down what the caller wants to schedule — scheduling will call back in the morning.',
      'Take down the caller name and callback number.',
      'Capture the caller name, callback number, and reason — someone will follow up in the morning.',
      'Take down their name, callback number, and the reason for their call.',
    ]);

    // ============================================================
    // Capability warning list — "things v1 can't do" surfaced in the
    // Additional instructions textarea. Single warning category: inform-only,
    // dismiss-until-prose-changes, never blocks save. Owned by PM; items come
    // off the list as capabilities ship.
    // ============================================================
    const CAPABILITIES = [
      {
        id: 'books_appointments',
        match: /\b(book|schedule|reschedule|cancel|set up|put on the calendar|arrange).*(appointment|visit|follow-?up|consult)|book a follow-?up\b/i,
        issue: "Can't book, reschedule, or cancel appointments.",
        fallback: "Booking requests will be captured as a message and sent to the inbox below.",
      },
      {
        id: 'lookup_records',
        match: /\b(look ?up|lookup|pull ?up|check|read|access|find).{0,100}\b(records?|chart|ehr|prescriptions?|history|lab results?|labs?|profiles?)\b/i,
        issue: "Can't access records, prescriptions, or lab results.",
        fallback: "It'll collect what the caller is asking about and pass it along as a message.",
      },
      {
        id: 'gives_medical_advice',
        match: /\b(recommend|suggest|advise|tell them to take|dosage|what dose|diagnose|prescrib|medical advice|side effect.{0,30}(should|ought to))\b/i,
        issue: "Can't give medical advice or recommend doses.",
        fallback: "Clinical questions will be captured as a message routed to the clinical team.",
      },
      {
        id: 'verify_insurance',
        match: /\b(verify|check|confirm).*(insurance|coverage|eligibility|benefits)|in[- ]?network/i,
        issue: "Can't verify insurance or eligibility.",
        fallback: "It'll note the caller's insurance question and pass it to the billing inbox.",
      },
      {
        id: 'outbound_message',
        match: /\b(text|sms|email|message them|send.*(text|sms|email|confirmation)|reply with)\b/i,
        issue: "Can't send texts or emails.",
        fallback: "It only takes a message during the call — follow-ups happen through your existing channels.",
      },
      {
        id: 'outbound_call',
        match: /\b(call them back|outbound call|dial|return their call|callback.*(automatically|right away))\b/i,
        issue: "Can't make outbound calls.",
        fallback: "Callback requests will be captured in the message so staff can follow up.",
      },
      {
        id: 'transfer_call',
        match: /\b(transfer|connect them|patch them|forward.*(call|caller)|put them through)\b/i,
        issue: "This node takes a message; it doesn't transfer calls.",
        fallback: "To route to a person, switch the action above to Transfer.",
      },
      {
        id: 'promises_outcomes',
        match: /\b(promise|guarantee).*(turnaround|by tomorrow|within|approve|refund|specific time)|promise.*prior auth/i,
        issue: "Don't promise outcomes, timing, approvals, or refunds.",
        fallback: "It can collect the question and let staff respond with specifics later.",
      },
      {
        id: 'payments',
        match: /\b(charge|refund|process.*(payment|card)|take their card|payment plan)\b/i,
        issue: "Can't process payments, refunds, or cards.",
        fallback: "Payment requests will be routed to the billing inbox for staff follow-up.",
      },
    ];

    function classifyProse(text) {
      if (!text || !text.trim()) return [];
      return CAPABILITIES.filter(c => {
        if (!c.match.test(text)) return false;
        if (c.id === 'gives_medical_advice' && isNegatedMedicalBoundary(text)) return false;
        return true;
      });
    }
    function hashProse(text) {
      let h = 0;
      for (let i = 0; i < text.length; i++) h = ((h << 5) - h + text.charCodeAt(i)) | 0;
      return String(h);
    }
    // intentId → Set of dismissed prose hashes (session-scoped, not persisted)
    const dismissedHashes = new Map();

    // Reusable per-clinic intake field library. Each field can be added to any intent's collect list.
    // In production: a clinic_intake_fields table seeded with defaults; clinics can add custom ones.
    const FIELD_LIBRARY = {
      caller_name:             { label: 'Full name',                    type: 'text'   },
      callback_number:         { label: 'Callback number',              type: 'phone'  },
      dob:                     { label: 'Date of birth',                type: 'date'   },
      patient_relation:        { label: 'Patient or proxy?',            type: 'choice' },
      reason_brief:            { label: 'Brief reason for call',        type: 'text'   },
      preferred_callback_time: { label: 'Preferred callback time',      type: 'text'   },
      urgency:                 { label: 'Urgency level',                type: 'choice' },
      pharmacy_name:           { label: 'Pharmacy',                     type: 'text'   },
      medication:              { label: 'Medication name',              type: 'text'   },
      account_number:          { label: 'Account number',               type: 'text'   },

    // Per-intent default collect lists — seeded based on what each intent typically needs.
    const DEFAULT_COLLECT = {
      sched:    [['caller_name',true],['callback_number',true],['preferred_callback_time',false],['reason_brief',false]],
      refill:   [['caller_name',true],['dob',true],['pharmacy_name',true],['medication',false]],
      billing:  [['caller_name',true],['callback_number',true],['dob',false],['account_number',false]],
      clinical: [['caller_name',true],['dob',true]],
      trial:    [['caller_name',true],['callback_number',true],['study_interest',false]],
    };

    // Realistic knowledge sources surfaced in each intent's "Knowledge source"
    // section. Each entry mirrors a doc set a clinic would actually point the
    // agent at — accepted insurance plans, FAQs, clinic hours, etc. The agent
    // pulls answers from these when the caller asks something it can answer
    // directly (vs. taking a message).
    const DEFAULT_KNOWLEDGE = {
      billing:  'Accepted insurance plans, payment plans & policies, billing FAQ, EOB explanations',
      clinical: 'Clinic medical FAQ, common discharge instructions, escalation triggers, provider on-call schedule',
      general:  'Hours of operation, location & directions, provider bios & specialties, services offered',
      // Custom intents (created via "Add custom intent") — fall through to a sensible default
      _default: 'Clinic FAQ, hours & location, provider directory',
    };

    // Intents mirror the 5 canonical intents defined in
    // server/api/src/modules/agent/transfer-intent-guide.ts (scheduling, billing,
    // medication, clinical, general). Trigger examples are pulled verbatim from
    // the "Positive" examples in that guide so the prototype mirrors what the
    // model actually classifies on.
    const FLOWS = {
      business: {
        label: "Business hours · Mon–Fri 9am–5pm",
        intents: [
          { id: 'scheduling', name: 'Scheduling', examples: ['I need to book an appointment', 'Can I reschedule my Tuesday visit?', 'Cancel my Friday appointment'], action: { type: 'transfer', targets: ['(415)-349-1121', '(415)-349-1122'] } },
          { id: 'clinical',   name: 'Medical',    examples: ['I want to talk to a nurse about my labs', 'I have a question about my discharge instructions', "I'm having side effects from a new med"], action: { type: 'message',  prompt: '', inbox: 'clinical_team', callbackExpectation: 'within_1bd' } },
          { id: 'billing',    name: 'Billing',    examples: ["I got a bill I don't understand", 'Set up a payment plan', 'Did my insurance cover the lab work?'], action: { type: 'message',  prompt: '', inbox: 'billing' } },
          { id: 'general',    name: 'General',    examples: ['Can I speak to someone?', 'Just put me through to the office'], action: { type: 'message',  prompt: '', inbox: 'front_desk' } },
          { id: 'urgent',     name: 'Urgent',     examples: ['this is urgent', "I'm having chest pain", 'I need help right now'], action: { type: 'transfer', targets: ['(415)-349-1121'] } },
        ],
      },
      afterhours: {
        label: "After hours · Weeknights + weekends",
        intents: [
          { id: 'urgent',     name: 'Urgent',     examples: ['this is urgent', "I'm having chest pain", 'I need help right now'], action: { type: 'transfer', targets: ['(415) 555-0911', '(415) 555-0912'] } },
          { id: 'scheduling', name: 'Scheduling', examples: ['I need to book an appointment'], action: { type: 'message', prompt: '', inbox: 'front_desk' }, overridden: true },
          { id: 'billing',    name: 'Billing',    examples: ["I got a bill I don't understand"], action: { type: 'message', prompt: '', inbox: 'billing' } },
          { id: 'clinical',   name: 'Clinical',   examples: ['I want to talk to a nurse about my labs'], action: { type: 'transfer', targets: ['(415) 555-0911'] }, overridden: true },
          { id: 'general',    name: 'General',    examples: ['Can I speak to someone?'], action: { type: 'message', prompt: '', inbox: 'front_desk' } },
        ],

    Object.values(FLOWS).forEach(flow => {
      flow.intents.forEach(intent => {
        if (intent.action.type === 'message' && !intent.action.collect) {

        }
      });

    const welcomeState = {
      text: "Thanks for calling Sterling Family Care. How may I help you today?",
      _defaultText: "Thanks for calling Sterling Family Care. How may I help you today?",
    };

    function currentWelcomeText() {
      return welcomeState.text || '(write a welcome message)';
    }

    // Seed each message action's _defaultPrompt so we can detect customization
    // later (prompt !== _defaultPrompt → user touched it). Only set if missing
    // (so a hydrated state from localStorage keeps its original default).
    Object.values(FLOWS).forEach(flow => {
      flow.intents.forEach(intent => {
        if (intent.action.type === 'message' && intent.action._defaultPrompt === undefined) {
          intent.action._defaultPrompt = '';

      });

    // Local persistence — survives page refresh

    const STORAGE_KEY = 'agent-cust-v3-state-v1';

    const RETIRED_INTENT_NAMES = new Set(['Clinical trial inquiry', 'New custom intent', 'Medication', 'Transfer to human', 'Talk to human']);

      const raw = localStorage.getItem(STORAGE_KEY);

        const saved = JSON.parse(raw);
        if (saved?.flows) {
          Object.keys(saved.flows).forEach(mode => {
            if (FLOWS[mode] || saved.flows[mode]?.custom) {
              FLOWS[mode] = saved.flows[mode];
              FLOWS[mode].intents = (FLOWS[mode].intents || []).filter(i => !RETIRED_INTENT_IDS.has(i.id) && !RETIRED_INTENT_NAMES.has(i.name));
            }
          });
        }
        if (saved?.welcome != null) welcomeState.text = saved.welcome;
      }
    } catch (e) { console.warn('Failed to hydrate from localStorage:', e); }

    Object.keys(SEED_INTENTS).forEach(mode => {
      if (!FLOWS[mode]) return;
      const have = new Set((FLOWS[mode].intents || []).map(i => i.id));
      SEED_INTENTS[mode].forEach(seedIntent => {
        if (!have.has(seedIntent.id)) {
          FLOWS[mode].intents.push(JSON.parse(JSON.stringify(seedIntent)));
        }
      });
    });

    function clearLegacyDefaultPrompts() {
      Object.values(FLOWS).forEach(flow => {
        (flow.intents || []).forEach(intent => {
          const action = intent.action;

          if (LEGACY_DEFAULT_PROMPTS.has(action.prompt || '')) action.prompt = '';
          if (LEGACY_DEFAULT_PROMPTS.has(action._defaultPrompt || '')) action._defaultPrompt = '';
          if (action._defaultPrompt === undefined) action._defaultPrompt = '';
        });
      });
    }

    const FIGMA_INTENT_ORDER = ['scheduling', 'clinical', 'billing', 'general', 'urgent'];
    function alignBusinessFlowToFigma() {
      const flow = FLOWS.business;
      if (!flow?.intents) return;
      const byId = new Map(flow.intents.map(intent => [intent.id, intent]));
      const patch = (id, updater) => {
        const intent = byId.get(id);
        if (intent) updater(intent);
      };
      patch('scheduling', intent => {
        intent.name = 'Scheduling';
        intent.action = { type: 'transfer', targets: ['(415)-349-1121', '(415)-349-1122'] };
      });
      patch('clinical', intent => {
        const previousAction = intent.action || {};
        const previousCollect = previousAction.collect || [];
        const previousByKey = new Map(previousCollect.map(f => [f.key, f]));
        const customCollect = previousCollect.filter(f => !['caller_name', 'dob'].includes(f.key));
        intent.name = 'Medical';
        intent.action = {
          type: 'message',
          prompt: previousAction.prompt || '',
          _defaultPrompt: previousAction._defaultPrompt || '',
          inbox: 'clinical_team',
          callbackExpectation: previousAction.callbackExpectation || 'within_1bd',
          emailEnabled: previousAction.emailEnabled === true,
          emailTo: previousAction.emailTo || '',
          collect: [
            previousByKey.get('caller_name') || { key: 'caller_name', required: true },
            previousByKey.get('dob') || { key: 'dob', required: true },
            ...customCollect,
          ],
        };
      });
      patch('billing', intent => {
        intent.name = 'Billing';
        if (intent.action?.type !== 'message') intent.action = { type: 'message', inbox: 'billing', prompt: '' };
        intent.action.inbox = 'billing';
      });
      patch('general', intent => {
        intent.name = 'General';
        if (intent.action?.type !== 'message') intent.action = { type: 'message', inbox: 'front_desk', prompt: '' };
        intent.action.inbox = 'front_desk';
      });
      patch('urgent', intent => {
        intent.name = 'Urgent';
        intent.action = { type: 'transfer', targets: ['(415)-349-1121'] };
      });
      const known = FIGMA_INTENT_ORDER.map(id => byId.get(id)).filter(Boolean);
      const custom = flow.intents.filter(intent => !FIGMA_INTENT_ORDER.includes(intent.id));
      flow.intents = [...known, ...custom];
    }

    clearLegacyDefaultPrompts();

    function serializeAction(action) {
      if (!action) return '';
      const obj = {};
      Object.keys(action).sort().forEach(k => {

      });
      return JSON.stringify(obj);

    function captureIntentBaselines() {
      Object.values(FLOWS).forEach(flow => {
        flow.intents.forEach(intent => {
          intent._baseline = serializeAction(intent.action);

    }
    captureIntentBaselines();

    // ============================================================
    // Action style — Figma 6483:2677–2702 (icon tint + color tokens)
    // ============================================================
    const ACTION_STYLE = {
      schedule: { bg: 'rgba(39,111,158,0.08)', border: 'rgba(39,111,158,0.15)', hoverBorder: 'rgba(39,111,158,0.30)', color: '#276f9e', icon: 'lightning', accentClass: 'title-accent-schedule' },
      message:  { bg: 'rgba(106,60,223,0.08)', border: 'rgba(106,60,223,0.15)', hoverBorder: 'rgba(106,60,223,0.30)', color: '#6a3cdf', icon: 'envelopeOpen', accentClass: 'title-accent-message' },
      transfer: { bg: 'rgba(10,124,46,0.08)', border: 'rgba(10,124,46,0.15)', hoverBorder: 'rgba(10,124,46,0.30)', color: '#0A7C2E', icon: 'phone', accentClass: 'title-accent-transfer' },
    };
    const WELCOME_STYLE = { bg: 'rgba(102,101,97,0.08)', border: 'rgba(102,101,97,0.15)', hoverBorder: 'rgba(102,101,97,0.30)', color: '#8E8C88' };

    // ============================================================
    // Card subtitle helpers
    // ============================================================
    function inboxDisplay(key) {
      const map = { billing: 'Billing inbox', clinical_team: 'Clinical inbox', front_desk: 'Front desk inbox', scheduling_athena: 'Scheduling in Athena' };
      return map[key] || (key ? `${key} inbox` : 'General inbox');
    }
    function scheduleSubtitle(a) {
      const caps = (a.capabilities || []).map(c => ({ book:'Booking', reschedule:'Rescheduling', cancel:'Cancellation' })[c]).filter(Boolean);
      const ehr = a.ehr || 'Athena';
      return caps.length ? `${ehr} • ${caps.join(' • ')}` : ehr;
    }
    function transferSubtitle(a) {
      const targets = a.targets || [];
      return targets.length === 0 ? 'No number set' : targets.length === 1 ? targets[0] : `${targets[0]} +${targets.length - 1}`;
    }
    function actionDisplayLabel(a) {
      if (a.type === 'message') return 'AI call';
      if (a.type === 'transfer') return 'transfer';
      if (a.type === 'schedule') return 'Schedule';
      return '';
    }
    function normalizedFieldValue(value) {
      return JSON.stringify(value ?? null);
    }
    function baselineAction(intent) {
      if (intent._baseline === undefined) return null;
      try { return JSON.parse(intent._baseline || '{}'); } catch { return null; }
    }
    function actionFieldChanged(base, current, keys) {
      return keys.some(key => normalizedFieldValue(base?.[key]) !== normalizedFieldValue(current?.[key]));
    }
    function actionTypeDisplay(type) {
      return ACTION_KINDS[type]?.headerLabel || type || 'Not set';
    }
    function textPreview(value, fallback = 'None') {
      const text = String(value ?? '').trim();
      if (!text) return fallback;
      return text.length > 96 ? `${text.slice(0, 93)}...` : text;
    }
    function callbackExpectationDisplay(value) {
      const map = {
        within_1h: 'Within 1 hour',
        within_4h: 'Within 4 hours',
        within_1bd: '1-2 business days',
        within_2bd: 'Within 2 business days',
        within_week: 'Within the week',
      };
      return map[value] || textPreview(value, 'Not set');
    }
    function collectDisplay(collect) {
      const items = (collect || []).map(field => {
        const label = FIELD_LIBRARY[field.key]?.label || field.label || field.key;
        return field.required === false ? `${label} (optional)` : label;
      });
      return textPreview(items.join(', '), 'None');
    }
    function emailDisplay(action) {
      if (!action?.emailEnabled) return 'Off';
      return action.emailTo ? `On (${textPreview(action.emailTo)})` : 'On';
    }
    function phoneNumbersDisplay(action) {
      const targets = action?.targets || (action?.target ? [action.target] : []);
      return textPreview(targets.join(', '), 'No number set');
    }
    function capabilitiesDisplay(action) {
      const caps = (action?.capabilities || []).map(c => ({ book: 'Booking', reschedule: 'Rescheduling', cancel: 'Cancellation' })[c]).filter(Boolean);
      const ehr = action?.ehr || 'Athena';
      return caps.length ? `${ehr}: ${caps.join(', ')}` : ehr;
    }
    function editedField(label, before, after) {
      return { label, detail: `${label}: ${before} → ${after}` };
    }
    function editedActionFieldDetails(intent) {
      const base = baselineAction(intent);
      const current = intent.action || {};
      if (!base || serializeAction(current) === intent._baseline) return [];
      const fields = [];
      if (actionFieldChanged(base, current, ['type'])) {
        fields.push(editedField('Action', actionTypeDisplay(base.type), actionTypeDisplay(current.type)));
      }
      if (actionFieldChanged(base, current, ['collect'])) {
        fields.push(editedField('Intake', collectDisplay(base.collect), collectDisplay(current.collect)));
      }
      if (actionFieldChanged(base, current, ['callbackExpectation'])) {
        fields.push(editedField('Callback promise', callbackExpectationDisplay(base.callbackExpectation), callbackExpectationDisplay(current.callbackExpectation)));
      }
      if (actionFieldChanged(base, current, ['prompt'])) {
        fields.push(editedField('Instructions', textPreview(base.prompt, 'No instructions'), textPreview(current.prompt, 'No instructions')));
      }
      if (actionFieldChanged(base, current, ['inbox'])) {
        fields.push(editedField('Inbox', inboxDisplay(base.inbox), inboxDisplay(current.inbox)));
      }
      if (actionFieldChanged(base, current, ['emailEnabled', 'emailTo'])) {
        fields.push(editedField('Email', emailDisplay(base), emailDisplay(current)));
      }
      if (actionFieldChanged(base, current, ['targets', 'target'])) {
        fields.push(editedField('Phone numbers', phoneNumbersDisplay(base), phoneNumbersDisplay(current)));
      }
      if (actionFieldChanged(base, current, ['capabilities', 'ehr'])) {
        fields.push(editedField('Capabilities', capabilitiesDisplay(base), capabilitiesDisplay(current)));
      }
      return fields;
    }
    function editedActionFields(intent) {
      return editedActionFieldDetails(intent).map(field => field.label);
    }
    function renderEditedField(field) {
      return `<span class="card-subtitle-edited-field">${escapeHtml(field.label)}</span>`;
    }
    function cardSubtitle(a) {
      if (a.type === 'message')  return '';
      if (a.type === 'schedule') return scheduleSubtitle(a);
      if (a.type === 'transfer') return transferSubtitle(a);
      return '';
    }
    function cardDisplaySubtitle(intent) {
      const edited = editedActionFieldDetails(intent);
      const action = intent.action || {};
      if (!edited.length) return escapeHtml(cardSubtitle(action));
      if (action.type === 'message') {
        return edited.map(renderEditedField).join(', ');
      }
      return `Edited: ${edited.map(renderEditedField).join(', ')}`;
    }
    function cardDisplayTitle(intent) {
      if ((intent.name || '').trim().toLowerCase() === 'transfer to human') return 'Human';
      return intent.name;
    }
    function resetIntentEditBaseline(intent) {
      if (!intent) return;
      intent._baseline = serializeAction(intent.action);
      if (_editingPanelKind === 'intent' && _editingIntent === intent) {
        _editingSnapshot = intentSnapshot(intent);
      }
    }
    function isIntentCustomized(intent) {
      // Compare the intent's current action against its captured baseline.
      // ANY change to a saved field flips this true → green dot shows on the
      // node icon. Baseline is reset on publish.
      if (intent._baseline === undefined) return false;
      return serializeAction(intent.action) !== intent._baseline;
    }

    let activeMode = 'business';
    let selectedNodeId = null;

    const $nodes = document.getElementById('canvas-nodes');
    const $svg = document.getElementById('canvas-svg');
    const $modeTriggerLabel = document.getElementById('mode-trigger-label');
    const $modeTriggerDot = document.getElementById('mode-trigger-dot');

    function modeDotClass(modeKey) {
      if (modeKey === 'business') return 'bg-emerald-500';
      if (modeKey === 'lunch') return 'bg-amber-500';
      if (modeKey === 'afterhours') return 'bg-stone-500';
      return 'bg-sky-500';
    }

    function shortModeLabel(label) {
      // "24/7 · Always on" → "24/7"; "Lunch · Mon–Fri 12pm–1pm" → "Lunch"
      return (label || '').split('·')[0].trim() || label;
    }

    function render() {
      const flow = FLOWS[activeMode];
      if ($modeTriggerLabel) $modeTriggerLabel.textContent = shortModeLabel(flow.label);
      if ($modeTriggerDot) $modeTriggerDot.className = 'hidden';

      $nodes.innerHTML = '';
      $svg.innerHTML = '';

      // Layout measured from the Figma frame (node 1335:3907).
      const INTENT_LEFT = 718;
      const NODE_CARD_HEIGHT = 60;
      const CARD_WIDTH = 216;
      const INTENT_ROW_GAP = 150;
      const startLeft = 54;
      const welcomeLeft = 327;
      const rowTop = 429;
      const welcomeCenterY = rowTop + NODE_CARD_HEIGHT / 2;
      const intentCardHeight = () => NODE_CARD_HEIGHT;
      const intentCenterYAt = (i) => welcomeCenterY + (i - (flow.intents.length - 1) / 2) * INTENT_ROW_GAP;
      const intentTopAt = (i) => intentCenterYAt(i) - intentCardHeight(flow.intents[i]) / 2;
      const addIntentTop = intentCenterYAt(flow.intents.length) - NODE_CARD_HEIGHT / 2;

      // Start (Incoming call) — kept as a labelled chip on the far left
      const $startNode = makeStartNode(startLeft, rowTop);
      $nodes.appendChild($startNode);

      // Welcome message
      $nodes.appendChild(makeWelcomeNode(welcomeLeft, rowTop));

      // Intent cards (combined intent + action)
      flow.intents.forEach((intent, i) => {
        const top = intentTopAt(i);
        $nodes.appendChild(makeIntentCard(intent, INTENT_LEFT, top));
      });

      // Add custom intent node below the active intent stack.
      $nodes.appendChild(makeAddIntentButton(INTENT_LEFT, addIntentTop));

      // Connections
      // Start (right edge measured from rendered node) → Welcome
      drawConnection(startLeft + CARD_WIDTH, welcomeCenterY, welcomeLeft, welcomeCenterY, 'c-start-welcome');
      // Welcome → each intent (fan-out)
      const welcomeRight = welcomeLeft + CARD_WIDTH;
      flow.intents.forEach((intent, i) => {
        const cardCenterY = intentCenterYAt(i);
        drawConnection(welcomeRight, welcomeCenterY, INTENT_LEFT, cardCenterY, `c-welcome-${intent.id}`);
      });
      syncCanvasFocusState();
    }

    function makeStartNode(left, topCenter) {
      // Vertically center against the welcome row.
      const top = topCenter;  // pass through the same vertical center as welcome
      const el = document.createElement('div');
      el.className = 'start-node absolute';
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
      el.dataset.nodeId = 'start';
      el.innerHTML = `
        <div class="card-shell no-bg">
          <div class="card-icon" style="background:rgba(102,101,97,0.08);color:#8E8C88">${ICON_SVG.flagPennant}</div>
          <div class="card-text">
            <div class="card-title">Incoming call</div>
            <div class="card-subtitle">${shortModeLabel(FLOWS[activeMode].label)}</div>
          </div>
        </div>`;

    function getConnectorColor() {
      return getComputedStyle(document.documentElement).getPropertyValue('--connector-color').trim() || '#D3D2D2';

    function getConnectorHoverColor() {
      return getComputedStyle(document.documentElement).getPropertyValue('--node-border-hover-color').trim() || '#A09F9F';
    }

    function connectorTargetConfig(target) {
      if (typeof target === 'string') return { id: target, hoverEnd: 'end' };
      return {
        id: target?.id,
        hoverEnd: target?.hoverEnd === 'start' ? 'start' : 'end'
      };
    }

    function setConnectionHover(targets, isActive) {
      const targetList = (targets && typeof targets !== 'string' && typeof targets[Symbol.iterator] === 'function')
        ? Array.from(targets)
        : [targets];
      targetList.forEach((target) => {
        const { id, hoverEnd } = connectorTargetConfig(target);
        const path = document.getElementById(id);
        if (!path) return;
        const connectorColor = getConnectorColor();
        if (!isActive) {
          path.setAttribute('stroke', connectorColor);
          return;
        }
        const gradient = document.getElementById(path.dataset.hoverGradientId);
        if (!gradient) return;
        const stops = gradient.querySelectorAll('stop');
        const startColor = hoverEnd === 'start' ? getConnectorHoverColor() : connectorColor;
        const endColor = hoverEnd === 'end' ? getConnectorHoverColor() : connectorColor;
        stops[0]?.setAttribute('stop-color', startColor);
        stops[1]?.setAttribute('stop-color', endColor);
        path.setAttribute('stroke', `url(#${gradient.id})`);
      });
    }

    function drawConnection(x1, y1, x2, y2, id, opts) {
      opts = opts || {};
      const xc = x1 + (x2 - x1) * 0.5;
      const d = `M ${x1} ${y1} C ${xc} ${y1}, ${xc} ${y2}, ${x2} ${y2}`;
      const defs = $svg.querySelector('defs') || document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      if (!defs.parentNode) $svg.appendChild(defs);
      const gradientId = `connector-hover-${String(id).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
      const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      gradient.setAttribute('id', gradientId);
      gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
      gradient.setAttribute('x1', x1);
      gradient.setAttribute('y1', y1);
      gradient.setAttribute('x2', x2);
      gradient.setAttribute('y2', y2);
      ['0%', '100%'].forEach((offset) => {
        const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop.setAttribute('offset', offset);
        stop.setAttribute('stop-color', getConnectorColor());
        gradient.appendChild(stop);
      });
      defs.appendChild(gradient);
      // Visible curve
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const connectorColor = getConnectorColor();
      path.setAttribute('d', d);
      path.setAttribute('stroke', connectorColor); path.setAttribute('stroke-width', '0.5');
      path.setAttribute('fill', 'none'); path.setAttribute('id', id);
      path.dataset.hoverGradientId = gradientId;
      path.classList.add('connection-path');
      $svg.appendChild(path);

      // Wider invisible hit-area + DOM disconnect button at midpoint (only when disconnect callback is supplied)
      if (typeof opts.disconnect === 'function') {
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', d);
        hit.setAttribute('stroke', 'transparent');
        hit.setAttribute('stroke-width', '18');
        hit.setAttribute('fill', 'none');
        hit.style.cursor = 'pointer';
        hit.style.pointerEvents = 'stroke';
        $svg.appendChild(hit);

        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const btn = document.createElement('button');
        btn.className = 'disconnect-btn';
        btn.style.left = `${mx - 11}px`;
        btn.style.top = `${my - 11}px`;
        btn.title = opts.label || 'Disconnect';
        btn.innerHTML = '<svg viewBox="0 0 256 256" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="56" y1="56" x2="200" y2="200"/><line x1="200" y1="56" x2="56" y2="200"/></svg>';
        btn.addEventListener('click', (e) => { e.stopPropagation(); opts.disconnect(); });
        $nodes.appendChild(btn);

        // Show button when hovering either the hit-area or the button itself
        const show = () => btn.classList.add('show');
        const hide = () => btn.classList.remove('show');
        hit.addEventListener('mouseenter', show);
        hit.addEventListener('mouseleave', hide);
        path.addEventListener('mouseenter', show);
        path.addEventListener('mouseleave', hide);
        btn.addEventListener('mouseenter', show);
        btn.addEventListener('mouseleave', hide);
      }
    }

		    function escapeHtml(value) {
		      return String(value ?? '')

		    function clampStickyNotePosition(x, y) {
		      if (!$conceptStickyNote) return { x, y };
		      const margin = 8;
		      const rect = $conceptStickyNote.getBoundingClientRect();
		      const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
		      const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
		      return {
		        x: Math.min(Math.max(x, margin), maxX),
		        y: Math.min(Math.max(y, margin), maxY),
		      };
		    }

		    function applyStickyNotePosition() {
		      if (!$conceptStickyNote || !stickyNotePosition) return;
		      const next = clampStickyNotePosition(stickyNotePosition.x, stickyNotePosition.y);
		      stickyNotePosition = next;
		      $conceptStickyNote.style.left = `${next.x}px`;
		      $conceptStickyNote.style.top = `${next.y}px`;
		      $conceptStickyNote.style.right = 'auto';
		      $conceptStickyNote.style.bottom = 'auto';
		    }

		    function enableStickyNoteDrag(note) {
		      if (!note) return;
		      let dragState = null;
		      note.addEventListener('pointerdown', (event) => {
		        if (event.button !== 0) return;
		        if (event.target.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;
		        const rect = note.getBoundingClientRect();
		        dragState = {
		          pointerId: event.pointerId,
		          offsetX: event.clientX - rect.left,
		          offsetY: event.clientY - rect.top,
		        };
		        stickyNotePosition = { x: rect.left, y: rect.top };
		        note.style.left = `${rect.left}px`;
		        note.style.top = `${rect.top}px`;
		        note.style.right = 'auto';
		        note.style.bottom = 'auto';
		        note.classList.add('dragging');
		        note.setPointerCapture(event.pointerId);
		        event.preventDefault();
		      });
		      note.addEventListener('pointermove', (event) => {
		        if (!dragState || event.pointerId !== dragState.pointerId) return;
		        stickyNotePosition = clampStickyNotePosition(event.clientX - dragState.offsetX, event.clientY - dragState.offsetY);
		        note.style.left = `${stickyNotePosition.x}px`;
		        note.style.top = `${stickyNotePosition.y}px`;
		        event.preventDefault();
		      });
		      const finishDrag = (event) => {
		        if (!dragState || event.pointerId !== dragState.pointerId) return;
		        dragState = null;
		        note.classList.remove('dragging');
		      };
		      note.addEventListener('pointerup', finishDrag);
		      note.addEventListener('pointercancel', finishDrag);
		    }

		    enableStickyNoteDrag($conceptStickyNote);

	      if (lower.includes('tone') || lower.includes('warm') || lower.includes('brief')) {
	        return 'I added a clinic-wide tone rule: keep responses warm, concise, and clear before moving into collection questions.';
	      }
	      if (lower.includes('emergency') || lower.includes('urgent') || lower.includes('symptom') || lower.includes('911')) {
	        return 'I added global safety handling: severe symptoms should use emergency guidance and should not stay in routine intake.';
	      }
	      if (lower.includes('identity') || lower.includes('verify') || lower.includes('dob') || lower.includes('date of birth')) {
	        return 'I added identity guidance: verify the caller before discussing account-specific or private details.';
	      }
	      if (lower.includes('billing') || lower.includes('insurance')) {
	        return 'I added a global boundary: collect billing or insurance context, but avoid giving unapproved financial or coverage advice.';
	      }

	    function analyzeGuardrailText(text) {

	      const byId = new Set();
	      classifyProse(text).forEach(item => {
	        if (byId.has(item.id)) return;
	        if (item.id === 'gives_medical_advice' && isNegatedMedicalBoundary(text)) return;
	        byId.add(item.id);
	        found.push({
	          id: item.id,
	          label: GUARDRAIL_LABELS[item.id] || 'Guardrail check',
	          severity: guardrailIssueSeverity(item),
	          issue: item.issue,
	          fallback: item.fallback,
	        });
	      });
	      GUARDRAIL_EXTRA_PATTERNS.forEach(item => {
	        if (!item.match.test(text || '') || byId.has(item.id)) return;
	        byId.add(item.id);
	        found.push(item);
	      });
	      return found;
	    }

	    function deriveGuardrailUnderstanding(text) {
	      const lower = (text || '').toLowerCase();
	      const collect = [];
	      if (/name|identity|full name/.test(lower)) collect.push('Name or identity');
	      if (/date of birth|dob/.test(lower)) collect.push('Date of birth');
	      if (/callback|phone/.test(lower)) collect.push('Callback number');
	      if (/medication|refill|pharmacy/.test(lower)) collect.push('Medication and pharmacy');
	      if (/symptom|side effect|reaction/.test(lower)) collect.push('Symptoms or side effects');
	      const never = [];
	      if (/do not|never|avoid/.test(lower) && /advice|dose|dosage|medical/.test(lower)) never.push('Do not give medical or dosing advice');
	      if (/promise|guarantee/.test(lower)) never.push('Do not promise outcomes');
	      const route = [];
	      if (/clinical/.test(lower)) route.push('Clinical inbox');
	      if (/billing/.test(lower)) route.push('Billing inbox');
	      if (/front desk|general/.test(lower)) route.push('Front desk inbox');
	      const escalate = [];
	      if (/emergency|chest pain|trouble breathing|fainting|allergic|self[- ]harm/.test(lower)) escalate.push('Emergency symptoms');
	      const unsupported = analyzeGuardrailText(text).filter(issue => ['warning', 'blocking'].includes(guardrailIssueSeverity(issue))).map(issue => issue.label);
	      return { collect, never, route, escalate, unsupported };
	    }

	    function riskyPhraseRanges(text) {
	      const ranges = [];
	      [
	        /\btake two pills\b/gi,
	        /\bdouble up\b/gi,
	        /\bmissed a dose\b/gi,
	        /\bmissed dose\b/gi,
	        /\bbook the follow-up appointment\b/gi,
	        /\btext the caller\b/gi,
	        /\blook up the patient chart\b/gi,
	      ].forEach(pattern => {
	        let match;
	        while ((match = pattern.exec(text || '')) !== null) {
	          ranges.push({ start: match.index, end: match.index + match[0].length });
	        }
	      });
	      return ranges.sort((a, b) => a.start - b.start);
	    }

	    function renderHighlightedInstruction(text) {
	      const ranges = riskyPhraseRanges(text);
	      if (!ranges.length) return escapeHtml(text || 'Type instructions to see risky phrases highlighted.');
	      let cursor = 0;
	      const parts = [];
	      ranges.forEach(range => {
	        if (range.start < cursor) return;
	        parts.push(escapeHtml(text.slice(cursor, range.start)));
	        parts.push(`<span class="guardrail-highlight">${escapeHtml(text.slice(range.start, range.end))}</span>`);
	        cursor = range.end;
	      });
	      parts.push(escapeHtml(text.slice(cursor)));
	      return parts.join('');
	    }

	    function updateGuardrailDynamicSlots(guardrailId, options = {}) {

	        scheduleGuardrailLatency(guardrailId, 'inline-results', GUARDRAIL_LATENCY_MS.inline, expectedText, () => {

	        scheduleGuardrailLatency(guardrailId, 'sidecar-output', GUARDRAIL_LATENCY_MS.sidecar, expectedText, () => {
	          const latestSidecar = document.getElementById('guardrail-sidecar-output');

		    function applyGuardrailToMedical(guardrailId) {
		      const rawText = guardrailText(guardrailId);
		      const text = rawText.trim();
		      const status = document.querySelector(`[data-guardrail-status="${guardrailId}"]`);
		      if (!text) {
		        if (status) status.textContent = 'Add an instruction first.';
		        return;
		      }

		      const finishApply = () => {
		        const intent = medicalIntent();
		        const changed = appendInstructionToIntent(intent, text);
		        if (status) status.textContent = changed ? 'Added to Medical instructions. Open Test conversation to verify.' : 'Already added to Medical instructions. Open Test conversation to verify.';
		        if (changed) {
		          markDirty();
		          refreshActionNodeCard(intent);
		        }
		        if (intent && $drawer && !$drawer.classList.contains('hidden')) {
		          testState.intentId = intent.id;
		          renderIntentPicker();
		          resetTestConversation();
		        }
		      };

		      if (guardrailId === 'savegate' && !GUARDRAIL_STATE.saveChecked) {
		        const savegateSlot = document.getElementById('guardrail-savegate-results');
		        const expectedText = rawText;
		        if (status) status.textContent = 'Checking before adding...';
		        if (savegateSlot) savegateSlot.innerHTML = renderSaveGateResult(text, 'pending');
		        scheduleGuardrailLatency(guardrailId, 'savegate', GUARDRAIL_LATENCY_MS.savegate, expectedText, () => {
		          GUARDRAIL_STATE.saveChecked = true;
		          const latestSlot = document.getElementById('guardrail-savegate-results');
		          if (latestSlot) {
		            latestSlot.innerHTML = renderSaveGateResult(guardrailText(guardrailId), true);
		            latestSlot.querySelectorAll('[data-guardrail-apply-rewrite]').forEach(button => {
		              button.addEventListener('click', () => applyGuardrailRewrite(guardrailId));
		            });
		          }
		          const blocking = analyzeGuardrailText(guardrailText(guardrailId)).some(issue => guardrailIssueSeverity(issue) === 'blocking');
		          if (blocking) {
		            if (status) status.textContent = 'Blocked. Use the safer rewrite before adding this instruction.';
		            return;
		          }
		          finishApply();
		        });
		        return;
		      }

		      if (guardrailId === 'savegate') {
		        const blocking = analyzeGuardrailText(text).some(issue => guardrailIssueSeverity(issue) === 'blocking');
		        if (blocking) {
		          if (status) status.textContent = 'Blocked. Use the safer rewrite before adding this instruction.';
		          return;
		        }
		      }

		      if (status) status.textContent = 'Applying instruction...';
		      scheduleGuardrailLatency(guardrailId, 'apply', GUARDRAIL_LATENCY_MS.apply, rawText, finishApply);
		    }
