    // Time-block dropdown (header)
    // 24/7 is the default, always-on mode. Lunch/After hours/etc. are
    // custom overrides — the user can add more via "+ Add time block".
    // ============================================================
    const $modeTrigger = document.getElementById('mode-trigger');
    const $modeMenu = document.getElementById('mode-menu');
    const $modeOptions = document.getElementById('mode-options');
    const $timeBlockModal = document.getElementById('time-block-modal');
    const $timeBlockForm = document.getElementById('time-block-form');
    const $timeBlockName = document.getElementById('time-block-name');
    const $timeBlockDays = document.getElementById('time-block-days');
    const $timeBlockStart = document.getElementById('time-block-start');
    const $timeBlockEnd = document.getElementById('time-block-end');
    const $timeBlockDuplicateTrigger = document.getElementById('time-block-duplicate-trigger');
    const $timeBlockDuplicateLabel = document.getElementById('time-block-duplicate-label');
    const $timeBlockDuplicateMenu = document.getElementById('time-block-duplicate-menu');
    const $timeBlockOverrideNote = document.getElementById('time-block-override-note');
    const $timeBlockError = document.getElementById('time-block-error');
    const TIME_BLOCK_DAY_OPTIONS = [
      ['mon', 'Mon'],
      ['tue', 'Tue'],
      ['wed', 'Wed'],
      ['thu', 'Thu'],
      ['fri', 'Fri'],
      ['sat', 'Sat'],
      ['sun', 'Sun'],
    ];
    let selectedTimeBlockDays = ['mon', 'tue', 'wed', 'thu', 'fri'];
    let selectedDuplicateMode = 'business';

    function renderModeOptions() {
      const keys = Object.keys(FLOWS);
      $modeOptions.innerHTML = keys.map(key => {
        const flow = FLOWS[key];
        const isActive = key === activeMode;
        const [primary, ...rest] = (flow.label || '').split('·');
        const subtitle = rest.join('·').trim();
        const overrides = flow.schedule?.overrides || flow.schedule?.duplicateFrom;
        const overrideLabel = overrides && FLOWS[overrides] ? `Overrides ${shortModeLabel(FLOWS[overrides].label)}` : '';
        const statusHtml = isActive
          ? `<span class="inline-flex items-center h-5 px-1.5 text-xs font-medium leading-5" style="background: #EAF1EA; color: #045508; border-radius: 8px">Live</span>`
          : '';
        return `
          <button data-mode="${key}" class="mode-option ${isActive ? 'is-selected' : ''} w-full text-left px-3 py-2 hover:bg-stone-50 flex items-center gap-2.5">
            <div class="flex-1 min-w-0">
              <div class="text-sm text-stone-900 ${isActive ? 'font-medium' : 'font-normal'}">${primary.trim()}</div>
              ${subtitle ? `<div class="text-xs text-stone-500 truncate">${subtitle}</div>` : ''}
              ${overrideLabel ? `<div class="text-xs truncate" style="color: var(--fg-secondary)">${overrideLabel}</div>` : ''}
            </div>
            ${statusHtml}
          </button>
        `;
      }).join('');
      $modeOptions.querySelectorAll('.mode-option').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMode = btn.dataset.mode;
          $modeMenu.classList.add('hidden');
          closePanel();
          render();
        });
      });
    }

    function selectedDayLabels() {
      return TIME_BLOCK_DAY_OPTIONS
        .filter(([key]) => selectedTimeBlockDays.includes(key))
        .map(([, label]) => label);
    }

    function timeBlockDaysLabel() {
      if (!selectedTimeBlockDays.length) return '';
      const keys = selectedTimeBlockDays.join(',');
      if (keys === 'mon,tue,wed,thu,fri') return 'Mon-Fri';
      if (keys === 'sat,sun') return 'Sat-Sun';
      if (keys === 'mon,tue,wed,thu,fri,sat,sun') return 'Every day';
      return selectedDayLabels().join(', ');
    }

    function formatTimeLabel(value) {
      const [hourRaw, minuteRaw] = String(value || '').split(':');
      const hour24 = Number(hourRaw);
      const minute = Number(minuteRaw || 0);
      if (Number.isNaN(hour24)) return value || '';
      const period = hour24 >= 12 ? 'pm' : 'am';
      const hour12 = hour24 % 12 || 12;
      return minute ? `${hour12}:${String(minute).padStart(2, '0')}${period}` : `${hour12}${period}`;
    }

    function timeBlockScheduleLabel() {
      const days = timeBlockDaysLabel();
      const start = formatTimeLabel($timeBlockStart?.value || '09:00');
      const end = formatTimeLabel($timeBlockEnd?.value || '17:00');
      return `${days} ${start}-${end}`;
    }

    function makeTimeBlockId(name) {
      const base = (name || timeBlockScheduleLabel() || 'time block')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 36) || 'time_block';
      let id = `block_${base}`;
      let count = 2;
      while (FLOWS[id]) {
        id = `block_${base}_${count}`;
        count += 1;
      }
      return id;
    }

    function updateTimeBlockOverrideNote() {
      const source = FLOWS[selectedDuplicateMode] || FLOWS.business;
      if ($timeBlockDuplicateLabel) $timeBlockDuplicateLabel.textContent = source.label || 'Business hours';
      if ($timeBlockOverrideNote) {
        const days = timeBlockDaysLabel();
        const windowLabel = days ? timeBlockScheduleLabel() : 'the selected time';
        $timeBlockOverrideNote.textContent = `Overrides ${shortModeLabel(source.label)} during ${windowLabel}.`;
      }
      if ($timeBlockError) $timeBlockError.classList.add('hidden');
    }

    function renderTimeBlockDayButtons() {
      if (!$timeBlockDays) return;
      $timeBlockDays.innerHTML = TIME_BLOCK_DAY_OPTIONS.map(([key, label]) => `
        <button type="button" class="time-day-button h-8 px-0" data-day="${key}" aria-pressed="${selectedTimeBlockDays.includes(key)}">${label}</button>
      `).join('');
      $timeBlockDays.querySelectorAll('[data-day]').forEach(button => {
        button.addEventListener('click', () => {
          const day = button.dataset.day;
          if (selectedTimeBlockDays.includes(day)) {
            selectedTimeBlockDays = selectedTimeBlockDays.filter(item => item !== day);
          } else {
            selectedTimeBlockDays = [...selectedTimeBlockDays, day].sort((a, b) => {
              const order = TIME_BLOCK_DAY_OPTIONS.map(([key]) => key);
              return order.indexOf(a) - order.indexOf(b);
            });
          }
          renderTimeBlockDayButtons();
          updateTimeBlockOverrideNote();
        });
      });
    }

    function renderTimeBlockDuplicateOptions() {
      if (!$timeBlockDuplicateMenu) return;
      const keys = Object.keys(FLOWS);
      $timeBlockDuplicateMenu.innerHTML = keys.map(key => {
        const label = FLOWS[key]?.label || key;
        const isSelected = key === selectedDuplicateMode;
        return `<button type="button" data-duplicate-mode="${escapeHtml(key)}" class="time-block-duplicate-option w-full text-left px-3 py-2 editor-field-value hover:bg-stone-50 inline-flex items-center gap-3 ${isSelected ? 'is-selected font-medium' : ''}"><span>${escapeHtml(label)}</span></button>`;
      }).join('');
      $timeBlockDuplicateMenu.querySelectorAll('[data-duplicate-mode]').forEach(button => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          selectedDuplicateMode = button.dataset.duplicateMode;
          $timeBlockDuplicateMenu.classList.add('hidden');
          renderTimeBlockDuplicateOptions();
          updateTimeBlockOverrideNote();
        });
      });
      updateTimeBlockOverrideNote();
    }

    function openTimeBlockModal() {
      if (!$timeBlockModal) return;
      selectedTimeBlockDays = ['mon', 'tue', 'wed', 'thu', 'fri'];
      if ($timeBlockName) $timeBlockName.value = '';
      if ($timeBlockStart) $timeBlockStart.value = '09:00';
      if ($timeBlockEnd) $timeBlockEnd.value = '17:00';
      selectedDuplicateMode = FLOWS[activeMode] ? activeMode : 'business';
      renderTimeBlockDayButtons();
      renderTimeBlockDuplicateOptions();
      $modeMenu?.classList.add('hidden');
      $timeBlockModal.classList.remove('hidden');
      window.setTimeout(() => $timeBlockName?.focus(), 0);
    }

    function closeTimeBlockModal() {
      if (!$timeBlockModal) return;
      $timeBlockModal.classList.add('hidden');
    }

    function createTimeBlockFromModal() {
      if (!$timeBlockForm) return;
      const name = ($timeBlockName?.value || '').trim();
      const start = $timeBlockStart?.value || '09:00';
      const end = $timeBlockEnd?.value || '17:00';
      if (!selectedTimeBlockDays.length || !start || !end) {
        if ($timeBlockError) {
          $timeBlockError.textContent = 'Choose at least one day, a start time, and an end time.';
          $timeBlockError.classList.remove('hidden');
        }
        return;
      }
      const sourceKey = selectedDuplicateMode || activeMode || 'business';
      const source = FLOWS[sourceKey] || FLOWS.business;
      const schedule = timeBlockScheduleLabel();
      const primary = name || timeBlockDaysLabel() || 'Custom time block';
      const id = makeTimeBlockId(primary);
      FLOWS[id] = {
        label: `${primary} · ${schedule}`,
        custom: true,
        schedule: {
          days: [...selectedTimeBlockDays],
          start,
          end,
          duplicateFrom: sourceKey,
          overrides: sourceKey,
        },
        intents: JSON.parse(JSON.stringify(source.intents || [])),
      };
      activeMode = id;
      closeTimeBlockModal();
      markDirty();
      closePanel();
      renderModeOptions();
      render();
    }

    if ($modeTrigger && $modeMenu) {
      $modeTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        renderModeOptions();
        $modeMenu.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => {
        if ($modeMenu.classList.contains('hidden')) return;
        if ($modeMenu.contains(e.target) || $modeTrigger.contains(e.target)) return;
        $modeMenu.classList.add('hidden');
      });
    }

    const $addTimeBlock = document.getElementById('add-time-block');
    if ($addTimeBlock) {
      $addTimeBlock.addEventListener('click', (e) => {
        e.stopPropagation();
        openTimeBlockModal();
      });
    }

    document.getElementById('time-block-close')?.addEventListener('click', closeTimeBlockModal);
    document.getElementById('time-block-cancel')?.addEventListener('click', closeTimeBlockModal);
    $timeBlockModal?.addEventListener('click', (event) => {
      if (event.target === $timeBlockModal) closeTimeBlockModal();
    });
    $timeBlockDuplicateTrigger?.addEventListener('click', (event) => {
      event.stopPropagation();
      $timeBlockDuplicateMenu?.classList.toggle('hidden');
    });
    $timeBlockForm?.addEventListener('submit', (event) => {
      event.preventDefault();
      createTimeBlockFromModal();
    });
    [$timeBlockName, $timeBlockStart, $timeBlockEnd].forEach(control => {
      control?.addEventListener('input', updateTimeBlockOverrideNote);
      control?.addEventListener('change', updateTimeBlockOverrideNote);
    });
    document.addEventListener('click', (event) => {
      if (!$timeBlockDuplicateMenu || $timeBlockDuplicateMenu.classList.contains('hidden')) return;
      if ($timeBlockDuplicateMenu.contains(event.target) || $timeBlockDuplicateTrigger?.contains(event.target)) return;
      $timeBlockDuplicateMenu.classList.add('hidden');
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && $timeBlockModal && !$timeBlockModal.classList.contains('hidden')) {
        closeTimeBlockModal();
      }
    });

    const $drawer = document.getElementById('test-drawer');
    const $drawerIcon = document.getElementById('test-toggle-icon');

    // ============================================================
    // Real-LLM test drawer — uses the backend /api/chat endpoint
    // which composes the actual production system prompt + this
    // intent's structured fields + rider, then calls Claude.
    // ============================================================
	    const testState = {
	      intentId: null,
	      messages: [],
	      lastMode: 'local',
	    };

	    const LOCAL_AGENT_PROMPT_BASIS = [
	      'Role: Freed, the automated front desk phone receptionist for Sterling Family Care.',
	      'Goal: help callers warmly and safely; collect enough detail for staff to act.',
	      'Strict limits: do not schedule appointments, refill or prescribe medication, provide medical advice, access charts, send texts, interpret insurance, or claim external actions are complete.',
	      'For medical questions: do not diagnose, assess, or ask clarifying medical questions beyond message-taking; route to the clinical team.',
	      'Intent-specific instructions are appended as an overlay and can change what details Freed collects, but cannot override strict limits.',
	    ];

	    function currentTestIntent() {
	      return FLOWS[activeMode].intents.find(i => i.id === testState.intentId);
	    }

	    function currentAppliedInstruction(intent) {
	      return (intent?.action?.prompt || '').trim();
	    }

	    function instructionEffectSummary(instruction) {
	      if (!instruction) return 'No custom instruction is applied yet. The response follows the base front-desk prompt only.';
	      const parts = [];
	      const lower = instruction.toLowerCase();
	      if (/medication|refill|pharmacy|days remaining/.test(lower)) parts.push('collects medication/refill details');
	      if (/clinical/.test(lower)) parts.push('routes to Clinical inbox');
	      if (/do not|never|avoid|cannot/.test(lower) && /advice|dose|dosage|medical/.test(lower)) parts.push('reinforces the no-medical-advice boundary');
	      if (/emergency|chest pain|trouble breathing|fainting|self[- ]harm|allergic/.test(lower)) parts.push('adds emergency escalation handling');
	      if (/chart|text|book|appointment|schedule/.test(lower)) parts.push('contains a request the base prompt may override');
	      return parts.length ? `Custom instruction active: ${parts.join(', ')}.` : 'Custom instruction active, but it does not add a clear detectable behavior in this local test.';
	    }

	    function renderIntentPicker() {
      const $picker = document.getElementById('test-intent-picker');
      $picker.innerHTML = FLOWS[activeMode].intents.map(i => `
        <button data-intent-id="${i.id}" class="test-intent-btn w-full text-left px-2.5 py-1.5 rounded-lg text-sm flex items-center gap-2 ${i.id === testState.intentId ? 'bg-stone-900 text-white' : 'hover:bg-stone-50 text-stone-700'}">
          <span class="w-1.5 h-1.5 rounded-full ${i.id === testState.intentId ? 'bg-white' : (i.custom ? 'bg-purple-500' : 'bg-stone-400')}"></span>
          <span class="truncate">${i.name}</span>
        </button>
      `).join('');
      $picker.querySelectorAll('.test-intent-btn').forEach(b => {
        b.addEventListener('click', () => {
          testState.intentId = b.dataset.intentId;
          renderIntentPicker();
          resetTestConversation();
        });
      });
    }

	    function resetTestConversation() {
	      testState.messages = [];
	      const intent = currentTestIntent();
	      const instruction = currentAppliedInstruction(intent);
	      document.getElementById('test-transcript').innerHTML = intent
	        ? `<div class="text-xs text-stone-400 italic">Testing <strong>${escapeHtml(intent.name)}</strong> (${escapeHtml(intent.action.type)}). Type as the caller below. The drawer uses the production /api/chat harness when available, then falls back to a local prompt simulation.</div>
	           <div class="mt-2 rounded-lg border border-stone-200 bg-stone-50 p-3 text-xs leading-4 text-stone-600">
	             <div class="font-medium text-stone-900">Applied instruction effect</div>
	             <div class="mt-1">${escapeHtml(instructionEffectSummary(instruction))}</div>
	           </div>
	           <div class="mt-3 flex flex-wrap gap-2">
	             <button type="button" class="guardrail-sample-button" data-test-sample="I missed a dose of my blood pressure medication. Should I take two now?">Missed-dose call</button>
	             <button type="button" class="guardrail-sample-button" data-test-sample="I need a refill and my pharmacy says they are waiting on the clinic.">Refill call</button>
	             <button type="button" class="guardrail-sample-button" data-test-sample="Can you look up my chart and text me the lab result?">Unsupported action</button>
	           </div>`
	        : '';
	      wireTestSampleButtons();
	    }

	    function wireTestSampleButtons() {
	      document.querySelectorAll('[data-test-sample]').forEach(button => {
	        button.addEventListener('click', () => {
	          const input = document.getElementById('test-input');
	          const form = document.getElementById('test-input-form');
	          input.value = button.dataset.testSample || '';
	          form.requestSubmit();
	        });
	      });
	    }

	    function appendTestMessage(role, content, opts) {
      opts = opts || {};
      const $t = document.getElementById('test-transcript');
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'bg-stone-900 text-white text-sm px-3 py-2 rounded-2xl rounded-tr-sm max-w-md whitespace-pre-wrap'
        : 'bg-stone-100 text-stone-900 text-sm px-3 py-2 rounded-2xl rounded-tl-sm max-w-md whitespace-pre-wrap';
      bubble.textContent = content;
      if (opts.thinking) bubble.classList.add('italic', 'text-stone-500');
      wrapper.appendChild(bubble);
      $t.appendChild(wrapper);
      $t.scrollTop = $t.scrollHeight;
	      return wrapper;
	    }

	    function appendTestEffectCard(result) {
	      const $t = document.getElementById('test-transcript');
	      const card = document.createElement('div');
	      const changed = !!result.changed;
	      card.className = 'rounded-lg border px-3 py-2 text-xs leading-4';
	      card.style.borderColor = changed ? 'rgba(23,126,29,0.20)' : 'rgba(167,109,0,0.20)';
	      card.style.background = changed ? 'rgba(23,126,29,0.06)' : 'rgba(167,109,0,0.08)';
      card.style.color = '#8E8C88';
	      card.innerHTML = `
	        <div class="font-medium" style="color:#21201d">${changed ? 'Custom instruction changed this response' : 'Base system prompt handled this response'}</div>
	        <div class="mt-1">${escapeHtml(result.effect || '')}</div>
	        <div class="mt-1" style="color:#8e8c88">Mode: ${escapeHtml(result.mode || 'local simulation')}</div>
	      `;
	      $t.appendChild(card);
	      $t.scrollTop = $t.scrollHeight;
	    }

	    function composeLocalPrompt(intent) {
	      const collect = intent.action.collect || [];
	      const required = collect.filter(f => f.required).map(f => FIELD_LIBRARY[f.key]?.label || f.key);
	      const optional = collect.filter(f => !f.required).map(f => FIELD_LIBRARY[f.key]?.label || f.key);
	      return [
	        ...LOCAL_AGENT_PROMPT_BASIS,
	        '',
	        `Intent: ${intent.name}`,
	        `Action: ${intent.action.type}${intent.action.type === 'message' ? `, route to ${inboxDisplay(intent.action.inbox)}` : ''}`,
	        `Required fields: ${required.length ? required.join(', ') : 'none'}`,
	        `Optional fields: ${optional.length ? optional.join(', ') : 'none'}`,
	        '',
	        'Intent-specific instructions:',
	        currentAppliedInstruction(intent) || '(none)',
	      ].join('\n');
	    }

	    function localAgentReply(intent, messages) {
	      const last = (messages[messages.length - 1]?.content || '').toLowerCase();
	      const instruction = currentAppliedInstruction(intent);
	      const lowerInstruction = instruction.toLowerCase();
	      const hasInstruction = !!instruction;
	      const asksDose = /\b(missed a dose|missed dose|double up|take two|dosage|what dose|dose)\b/.test(last);
	      const asksRefill = /\b(refill|medication|prescription|pharmacy)\b/.test(last);
	      const asksSchedule = /\b(book|schedule|appointment|follow-up|reschedule|cancel)\b/.test(last);
	      const asksChart = /\b(chart|record|lab result|look up|text me|send me)\b/.test(last);
	      const emergency = /\b(can't breathe|cannot breathe|chest pain|unconscious|medical emergency|severe allergic|self harm|suicidal)\b/.test(last);
	      const wantsClinicalRoute = /clinical/.test(lowerInstruction);
	      const wantsMedicationDetails = /medication|pharmacy|days remaining|refill/.test(lowerInstruction);
	      const reinforcesSafety = /\b(do not|never|avoid|cannot|can't)\b/.test(lowerInstruction) && /advice|dose|dosage|medical/.test(lowerInstruction);

	      if (emergency) {
	        return {
	          reply: 'If you believe this is a medical emergency, you may want to hang up and call 911. If not, I can take a message for the clinical team.',
	          changed: /emergency|chest pain|trouble breathing|fainting|self[- ]harm|allergic/.test(lowerInstruction),
	          effect: hasInstruction ? 'The custom instruction reinforces emergency escalation, but the base prompt already has an absolute emergency rule.' : 'No custom instruction was needed because the base prompt has an absolute emergency rule.',
	          mode: 'local simulation',
	        };
	      }

	      if (asksDose) {
	        const detailAsk = wantsMedicationDetails
	          ? 'What medication is this about, which pharmacy do you use, how many days do you have remaining, and what is the best callback number?'
	          : 'I can take a message for the clinical team. What is your name, date of birth, and best callback number?';
	        return {
	          reply: `I cannot advise on medication dosing or whether to change how you take it. ${detailAsk}`,
	          changed: wantsMedicationDetails || wantsClinicalRoute || reinforcesSafety,
	          effect: hasInstruction
	            ? 'The applied instruction changed the follow-up questions and routing while the base prompt still blocks dosing advice.'
	            : 'The response is safe, but it only uses the base system prompt because no custom instruction is applied.',
	          mode: 'local simulation',
	        };
	      }

	      if (asksSchedule) {
	        return {
	          reply: 'I cannot book or confirm appointments here. I can take the request and have the team follow up. What days or times generally work for you?',
	          changed: /book|schedule|appointment/.test(lowerInstruction),
	          effect: /book|schedule|appointment/.test(lowerInstruction)
	            ? 'The custom instruction tried to add scheduling behavior, but the base system prompt overrode it because scheduling is a strict limit.'
	            : 'The base system prompt handled this scheduling boundary.',
	          mode: 'local simulation',
	        };
	      }

	      if (asksChart) {
	        return {
	          reply: 'I cannot access patient charts or send text confirmations. I can take the details for staff to review. What should I include in the message?',
	          changed: /chart|text|sms|record|look up/.test(lowerInstruction),
	          effect: /chart|text|sms|record|look up/.test(lowerInstruction)
	            ? 'The custom instruction requested an unsupported action, so the base system prompt constrained the response.'
	            : 'The base system prompt handled this unsupported-action boundary.',
	          mode: 'local simulation',
	        };
	      }

	      if (asksRefill) {
	        return {
	          reply: wantsMedicationDetails
	            ? 'I can take that refill message for the clinical team. What medication is it, which pharmacy do you use, how many days do you have left, and what callback number should they use?'
	            : 'I can take a message for the team. What is your name, date of birth, and the best callback number?',
	          changed: wantsMedicationDetails || wantsClinicalRoute,
	          effect: hasInstruction
	            ? 'The applied instruction changed the intake from generic message-taking to refill-specific details.'
	            : 'The response stayed generic because no custom instruction is applied.',
	          mode: 'local simulation',
	        };
	      }

	      return {
	        reply: hasInstruction
	          ? 'I can take a detailed message and follow the clinic-specific instructions for this call. What would you like the team to know?'
	          : 'I can take a detailed message for the clinic. What can I help with?',
	        changed: hasInstruction,
	        effect: hasInstruction ? 'The custom instruction is present, so the response acknowledges clinic-specific handling.' : 'No custom instruction is applied yet.',
	        mode: 'local simulation',
	      };
	    }

	    async function requestAgentReply(intent, messages) {
	      const canUseHarness = window.location.protocol === 'http:' || window.location.protocol === 'https:';
	      if (canUseHarness) {
	        try {
	          const resp = await fetch('/api/chat', {
	            method: 'POST',
	            headers: { 'content-type': 'application/json' },
	            body: JSON.stringify({ intent, messages, fieldLibrary: FIELD_LIBRARY }),
	          });
	          if (resp.ok) {
	            const data = await resp.json();
	            if (!data.error && data.reply) {
	              return {
	                reply: data.reply,
	                changed: !!currentAppliedInstruction(intent),
	                effect: currentAppliedInstruction(intent)
	                  ? 'Response came from the local /api/chat harness using the composed production prompt plus the applied instruction.'
	                  : 'Response came from the local /api/chat harness using the base composed production prompt.',
	                mode: 'Claude harness',
	              };
	            }
	          }
	        } catch {}
	      }
	      await waitForGuardrailLatency(GUARDRAIL_LATENCY_MS.conversation);
	      return localAgentReply(intent, messages);
	    }

    document.getElementById('test-input-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const intent = currentTestIntent();
      if (!intent) return;
      const input = document.getElementById('test-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.disabled = true;

      testState.messages.push({ role: 'user', content: text });
      appendTestMessage('user', text);
      const thinkingEl = appendTestMessage('assistant', 'Thinking…', { thinking: true });

	      try {
	        const result = await requestAgentReply(intent, testState.messages);
	        thinkingEl.remove();
	        testState.lastMode = result.mode || 'local';
	        testState.messages.push({ role: 'assistant', content: result.reply });
	        appendTestMessage('assistant', result.reply);
	        appendTestEffectCard(result);
	      } catch (err) {
	        thinkingEl.remove();
	        appendTestMessage('assistant', 'Network error: ' + err.message);
      } finally {
        input.disabled = false;
        input.focus();
      }
    });

    document.getElementById('test-reset').addEventListener('click', () => {
      resetTestConversation();
    });

	    document.getElementById('test-show-prompt').addEventListener('click', async () => {
	      const intent = currentTestIntent();
	      if (!intent) return;
	      try {
	        let prompt = '';
	        const canUseHarness = window.location.protocol === 'http:' || window.location.protocol === 'https:';
	        if (canUseHarness) {
	          try {
	            const resp = await fetch('/api/compose', {
	              method: 'POST',
	              headers: { 'content-type': 'application/json' },
	              body: JSON.stringify({ intent, fieldLibrary: FIELD_LIBRARY }),
	            });
	            const data = await resp.json();
	            prompt = data.prompt || data.error || '';
	          } catch {}
	        }
	        if (!prompt) prompt = composeLocalPrompt(intent);
	        const overlay = document.createElement('div');
	        overlay.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-8';
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        const box = document.createElement('div');
        box.className = 'bg-white rounded-xl w-full max-w-3xl flex flex-col';
        box.style.height = '85vh';
        box.innerHTML = `
          <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
	            <div>
	              <div class="text-sm font-medium text-stone-900">Composed system prompt</div>
	              <div class="text-xs text-stone-500 mt-0.5">${canUseHarness ? 'Production harness when available, local prompt summary otherwise' : 'Local prompt summary'} + per-intent overlay for "${escapeHtml(intent.name)}"</div>
	            </div>
            <button class="w-7 h-7 rounded-lg flex items-center justify-center text-stone-400 hover:text-stone-900 hover:bg-stone-100 text-xl leading-none transition" aria-label="Close">×</button>
          </div>
          <pre class="flex-1 overflow-auto p-4 text-xs whitespace-pre-wrap" style="font-family:'JetBrains Mono',ui-monospace,monospace"></pre>
        `;
        box.querySelector('button').addEventListener('click', () => overlay.remove());
	        box.querySelector('pre').textContent = prompt || '(no prompt)';
        overlay.appendChild(box);
        document.body.appendChild(overlay);
      } catch (err) {
        alert('Failed to load prompt: ' + err.message);
      }
    });

    document.getElementById('test-toggle').addEventListener('click', () => {
      const wasCollapsed = $drawer.classList.contains('collapsed');
      if (wasCollapsed) {
        openTestDrawer();
      } else {
        $drawer.classList.add('collapsed');
        $drawerIcon.textContent = '▴';
      }
    });

    function openTestDrawer(intentId) {
      $drawer.classList.remove('hidden');
      updateTestDrawerInset();
      const allIntents = FLOWS[activeMode].intents;
      // Pick: provided id → currently-open side-panel intent → first
      const sidePanelSelected = document.querySelector('.flow-node.selected[data-node-id^="intent-"], .flow-node.selected[data-node-id^="action-"]');
      const selectedId = sidePanelSelected ? sidePanelSelected.dataset.nodeId.replace(/^(intent|action)-/, '') : null;
      const candidate = intentId || selectedId || (allIntents[0] && allIntents[0].id);
      if (!allIntents.find(i => i.id === candidate)) {
        testState.intentId = allIntents[0] ? allIntents[0].id : null;
      } else {
        testState.intentId = candidate;
      }
      renderIntentPicker();
      resetTestConversation();
      $drawer.classList.remove('collapsed');
      $drawerIcon.textContent = '▾';
      setTimeout(() => document.getElementById('test-input').focus(), 100);
    }

    function updateTestDrawerInset() {
      if (!$drawer) return;
      if ($sidePanel && !$sidePanel.classList.contains('hidden')) {
        const rect = $sidePanel.getBoundingClientRect();
        const inset = Math.max(0, Math.round(window.innerWidth - rect.left));
        $drawer.style.right = `${inset}px`;
      } else {
        $drawer.style.right = '0px';
      }
    }

    window.addEventListener('resize', updateTestDrawerInset);

    document.getElementById('open-test').addEventListener('click', () => openTestDrawer());

    render();

    // ============================================================
    // Canvas zoom & pan (Figma-style)
    // ============================================================
    const $viewport = document.getElementById('canvas-viewport');
    const $transform = document.getElementById('canvas-transform');
    const $zoomPct = document.getElementById('zoom-pct');
    let zoom = 0.85;
    let panX = 0;
    let panY = 0;
    const ZOOM_MIN = 0.25;
    const ZOOM_MAX = 2;

    function applyTransform() {
      $transform.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      $zoomPct.textContent = `${Math.round(zoom * 100)}%`;
    }

    // Promote the canvas to a composited layer only while the user is actively
    // panning/zooming. After 200ms of stillness, drop the will-change so the
    // browser re-rasterizes the layer at the new scale → crisp text and lines.
    let interactingTimer = null;
    function markInteracting() {
      $transform.classList.add('interacting');
      if (interactingTimer) clearTimeout(interactingTimer);
      interactingTimer = setTimeout(() => $transform.classList.remove('interacting'), 200);
    }

    // Wheel: zoom centered on the cursor by default. Hold shift to pan with the wheel.
    $viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      markInteracting();
      if (e.shiftKey) {
        // Shift+wheel pans (mouse users without a trackpad / horizontal scroll)
        panX -= e.deltaX || e.deltaY;
        panY -= e.shiftKey ? 0 : e.deltaY;
      } else {
        const rect = $viewport.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const oldZoom = zoom;
        // Trackpad pinch sends a larger deltaY with ctrlKey; mouse wheel sends ~100 increments.
        // Normalize by clamping so a single notch doesn't slingshot you to the zoom limit.
        const rawDelta = -e.deltaY;
        const delta = Math.max(-0.25, Math.min(0.25, rawDelta * 0.005));
        zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * (1 + delta)));
        const k = zoom / oldZoom;
        panX = cx - (cx - panX) * k;
        panY = cy - (cy - panY) * k;
      }
      applyTransform();
    }, { passive: false });

    // Drag on empty canvas to pan
    let isDragging = false;
    let lastX = 0, lastY = 0;
    $viewport.addEventListener('mousedown', (e) => {
      // Bail if clicking on a node, button, or any UI chrome
      if (e.target.closest('.flow-node') || e.target.closest('button') || e.target.closest('#side-panel') || e.target.closest('#test-drawer') || e.target.closest('#add-intent-dropdown')) return;
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      $viewport.style.cursor = 'grabbing';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX += e.clientX - lastX;
      panY += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      markInteracting();
      applyTransform();
    });
    window.addEventListener('mouseup', () => {
      if (isDragging) { isDragging = false; $viewport.style.cursor = ''; }
    });

    function zoomBy(factor) {
      const rect = $viewport.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const oldZoom = zoom;
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * factor));
      const k = zoom / oldZoom;
      panX = cx - (cx - panX) * k;
      panY = cy - (cy - panY) * k;
      markInteracting();
      applyTransform();
    }

    document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.2));
    document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.2));
    document.getElementById('zoom-reset').addEventListener('click', () => {
      zoom = 0.85; panX = 0; panY = 0;
      applyTransform();
    });

    // Lightweight prompt-input handler — just keeps the counter live
    // and lets the model state mirror what's in the textarea.
    // (Drag/draft state is managed by the simple isDirty flag in markDirty/markPublished above.)
    function handlePromptInput(textarea) {
      const intentId = textarea.dataset.intentId;
      const intent = FLOWS[activeMode].intents.find(i => i.id === intentId);
      if (!intent) return;
      intent.action.prompt = textarea.value;
      const counter = document.getElementById('prompt-counter');
      if (counter) {
        const len = textarea.value.length;
        counter.textContent = `${len}/${PROMPT_LIMIT}`;
	        counter.className = `text-xs leading-[16px] ${len > 400 ? 'text-amber-600' : 'text-[#8e8c88]'}`;
      }
      const ph = document.getElementById('prompt-placeholder');
      if (ph) ph.classList.toggle('hidden', textarea.value.length > 0);
      // Run the safeguard immediately so unsupported instructions surface as the user types.
      scheduleProseClassify(intentId, textarea.value, textarea);
      // Repaint the canvas action card so the customization tint reflects the current state
      refreshActionNodeCard(intent);
      markDirty();
    }

    // ============================================================
    // Capability-warning render pipeline.
    //   • Render immediately as the clinic types
    //   • Render synchronously (regex classify is local; no AI call)
    //   • Dismiss is in-memory per (intentId, prose hash) — pose change clears it
    //   • Never blocks save; absence is acceptable
    // ============================================================
    let proseClassifyTimer = null;

    function scheduleProseClassify(intentId, text, sourceEl) {
      if (proseClassifyTimer) clearTimeout(proseClassifyTimer);
      renderProseWarning(intentId, text, sourceEl);
    }

    function proseWarningSlot(intentId, sourceEl) {
      const scoped = sourceEl?.closest?.('.editor-text-field')?.querySelector?.('.prose-warning-slot');
      if (scoped) return scoped;
      return Array.from(document.querySelectorAll('.prose-warning-slot, #prose-warning-slot'))
        .find(slot => slot.dataset.intentId === intentId);
    }

    function renderProseWarning(intentId, text, sourceEl) {
      const slot = proseWarningSlot(intentId, sourceEl);
      if (!slot) return;
      const hash = hashProse(text || '');
      const dismissedSet = dismissedHashes.get(intentId) || new Set();
      if (dismissedSet.has(hash) || !text || !text.trim()) {
        slot.innerHTML = '';
        slot.dataset.warningKey = '';
        return;
      }
      const violations = classifyProse(text);
      if (violations.length === 0) {
        slot.innerHTML = '';
        slot.dataset.warningKey = '';
        return;
      }
      const warningKey = violations.map(v => v.id).join('|');
      if (slot.dataset.warningKey === warningKey && slot.innerHTML.trim()) return;
      slot.dataset.warningKey = warningKey;

      // Amber inline alert, placed inside the custom-instructions field.
      // Multiple violations stack as separate alert cards so each card remains dismissable.
      slot.innerHTML = `<div class="flex flex-col gap-2">${violations.map((v, i) => `
        <div class="warning-card flex items-center gap-2 pl-3 pr-2 py-2"
             data-violation-idx="${i}"
             style="background: #F8F6ED; border-radius: 8px;">
          <span class="warning-message flex-1" style="font-weight:400;color:#A87F03;">${v.issue}</span>
          <button class="prose-warning-dismiss inline-flex items-center justify-center shrink-0 rounded-lg hover:bg-black/5 transition"
                  data-violation-idx="${i}"
                  style="color:#A87F03;"
                  aria-label="Dismiss">
            <svg width="14" height="14" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="200" y1="56"  x2="56"  y2="200"/>
              <line x1="200" y1="200" x2="56"  y2="56"/>
            </svg>
          </button>
        </div>
      `).join('')}</div>`;

      // Dismiss = hide all warnings for the current prose hash. (Per-card dismiss would
      // require tracking dismissals at sub-hash granularity; the locked-in behavior is
      // "dismiss until prose changes", so one click hides everything for this state.)
      slot.querySelectorAll('.prose-warning-dismiss').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!dismissedHashes.has(intentId)) dismissedHashes.set(intentId, new Set());
          dismissedHashes.get(intentId).add(hash);
          const cards = Array.from(slot.querySelectorAll('.warning-card'));
          cards.forEach((card) => {
            card.style.maxHeight = `${card.scrollHeight}px`;
            card.getBoundingClientRect();
            card.classList.add('is-dismissing');
          });
          window.setTimeout(() => {
            slot.innerHTML = '';
          }, 190);
        });
      });
    }

    // Run classification immediately when an intent panel opens with existing prose
    // (so violations on already-saved instructions show up without typing).
    const _origOpenIntentPanel = openIntentPanel;
    openIntentPanel = function (intentId) {
      _origOpenIntentPanel(intentId);
      const intent = FLOWS[activeMode].intents.find(i => i.id === intentId);
      if (intent?.action?.type === 'message') {
        // Defer to next tick so the slot is in the DOM
        setTimeout(() => renderProseWarning(intent.id, intent.action.prompt || ''), 0);
      }
	    };
	    const initialPrototypeMode = prototypeModeFromUrl();
	    document.body.classList.toggle('final-solution', initialPrototypeMode === 'final');
	    if (initialPrototypeMode !== 'final') renderPrototypeNav(initialPrototypeMode);
		    setTimeout(() => {
		      if (initialPrototypeMode === 'final') {
		        hideInstructionConceptChrome();
		        selectedNodeId = null;
		        $sidePanel.classList.add('hidden');
		        $previewPanel.classList.add('hidden');
		        setPanelStackOpen(false);
		        updateTestDrawerInset();
		        render();
		      } else if (initialPrototypeMode === 'guardrails') {
		        openGuardrailPrototype(PROTOTYPE_NAV.guardrails.initial);
		      } else {
		        openInstructionConcept(PROTOTYPE_NAV.instructions.initial);
	      }
	    }, 0);
  </script>

  <!-- ============================================================
       Hero autoplay driver. Enabled only when the page is loaded
       with ?autoplay=1 (the case-study hero iframe does this). It
       runs a looping, hands-free walkthrough with a synthetic
       cursor: open Medical → AI call, add a custom instruction,
       dismiss the capability banner, preview, then close panels.
       The real prototype is untouched when autoplay is absent.
       ============================================================ -->
  <script>
  (function () {
    if (new URLSearchParams(location.search).get('autoplay') !== '1') return;

    const CLINICAL_ID = 'clinical';
    const INSTRUCTION = 'Look up patient profile';
    const SPEED = 1.2;              // playback rate (1.2x)
    const t = (n) => Math.round(n / SPEED);
    const MOVE = t(600);           // cursor travel duration
    // Cursor.svg has its pointing tip at ~(10, 5) within the 24×24 viewBox.
    const TIP_X = 10, TIP_Y = 5;

    const styleEl = document.createElement('style');
    styleEl.textContent = `
      #autoplay-shield { position: fixed; inset: 0; z-index: 9998; cursor: default; }
      #autoplay-cursor {
        position: fixed; top: 0; left: 0; width: 24px; height: 24px;
        z-index: 9999; pointer-events: none; transform: translate(-${TIP_X}px, -${TIP_Y}px);
        transition: top ${MOVE}ms cubic-bezier(.4,.1,.2,1), left ${MOVE}ms cubic-bezier(.4,.1,.2,1);
      }
      #autoplay-cursor .autoplay-cursor-inner { position: relative; display: block; width: 24px; height: 24px; }
      #autoplay-cursor img { display: block; width: 24px; height: 24px; }
      #autoplay-cursor.is-clicking .autoplay-cursor-inner { animation: autoplayTap 200ms cubic-bezier(0.215,0.61,0.355,1); }
      @keyframes autoplayTap { 0%,100% { transform: scale(1); } 50% { transform: scale(0.92); } }
      .autoplay-ping {
        position: absolute; left: ${TIP_X}px; top: ${TIP_Y}px; width: 24px; height: 24px;
        border-radius: 999px; background: rgba(91,91,214,0.30);
        transform: translate(-50%,-50%) scale(.4); opacity: 0;
      }
      #autoplay-cursor.is-clicking .autoplay-ping { animation: autoplayPing 300ms cubic-bezier(0.215,0.61,0.355,1); }
      @keyframes autoplayPing { 0% { opacity:.7; transform: translate(-50%,-50%) scale(.4);} 100% { opacity:0; transform: translate(-50%,-50%) scale(1.4);} }

      /* Synthetic hover states (CSS :hover can't be forced from a fake cursor). */
      .flow-node.autoplay-hover .card-shell {
        background: #ffffff; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        transform: translateX(0) scale(1); border-color: var(--node-border-hover-color);
      }
      .flow-node.autoplay-hover .card-icon {
        transform: translateY(0) rotate(-4deg); border-width: .5px;
        border-color: var(--icon-border-hover, color-mix(in srgb, currentColor 30%, transparent)) !important;
        box-shadow: 0 2px 8px color-mix(in srgb, currentColor 10%, transparent);
      }
      #panel-preview-btn.autoplay-hover .preview-icon path { animation: previewWavePulse 840ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      #panel-preview-btn.autoplay-hover .preview-icon path:nth-child(1) { animation-delay: 0ms; }
      #panel-preview-btn.autoplay-hover .preview-icon path:nth-child(2) { animation-delay: 42ms; }
      #panel-preview-btn.autoplay-hover .preview-icon path:nth-child(3) { animation-delay: 84ms; }
      #panel-preview-btn.autoplay-hover .preview-icon path:nth-child(4) { animation-delay: 126ms; }
      #panel-preview-btn.autoplay-hover .preview-icon path:nth-child(5) { animation-delay: 168ms; }
    `;
    document.head.appendChild(styleEl);

    const shield = document.createElement('div');
    shield.id = 'autoplay-shield';

    const cursor = document.createElement('div');
    cursor.id = 'autoplay-cursor';
    cursor.innerHTML =
      '<span class="autoplay-ping"></span>' +
      '<span class="autoplay-cursor-inner"><img src="/work/clinic-ai-assistant/Cursor.svg" alt="" draggable="false"></span>';

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const $ = (sel) => document.querySelector(sel);

    function placeCursorAtCenter() {
      cursor.style.left = (window.innerWidth / 2) + 'px';
      cursor.style.top = (window.innerHeight / 2) + 'px';
    }

    async function moveTo(el, dx = 0, dy = 0) {
      if (!el) return false;
      const r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) return false;
      cursor.style.left = (r.left + r.width / 2 + dx) + 'px';
      cursor.style.top = (r.top + r.height / 2 + dy) + 'px';
      await sleep(MOVE + t(80));
      return true;
    }

    function setHover(el, on) {
      if (el) el.classList.toggle('autoplay-hover', on);
    }

    async function doClick(el) {
      cursor.classList.remove('is-clicking');
      void cursor.offsetWidth;
      cursor.classList.add('is-clicking');
      await sleep(t(150));
      try { el.click(); } catch (e) { return false; }
      await sleep(t(340));
      return true;
    }

    async function tap(el, dx = 0, dy = 0) {
      if (!el || !(await moveTo(el, dx, dy))) return false;
      return doClick(el);
    }

    // Move onto the element, let its hover animation play, then click.
    async function hoverTap(el, hoverMs, dx = 0, dy = 0) {
      if (!el || !(await moveTo(el, dx, dy))) return false;
      setHover(el, true);
      await sleep(hoverMs);
      const ok = await doClick(el);
      setHover(el, false);
      return ok;
    }

    async function typeInto(el, text) {
      if (!el) return;
      el.focus();
      el.value = '';
      el.dispatchEvent(new Event('input', { bubbles: true }));
      for (let i = 0; i < text.length; i++) {
        el.value += text[i];
        el.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(t(52));
      }
    }

    function clinicalIntent() {
      try { return FLOWS[activeMode].intents.find((i) => i.id === CLINICAL_ID); }
      catch (e) { return null; }
    }

    function resetState() {
      try { document.querySelectorAll('.autoplay-hover').forEach((e) => e.classList.remove('autoplay-hover')); } catch (e) {}
      try { document.getElementById('preview-panel')?.classList.add('hidden'); } catch (e) {}
      try { document.getElementById('side-panel')?.classList.add('hidden'); } catch (e) {}
      const intent = clinicalIntent();
      if (intent && intent.action) {
        intent.action.prompt = '';
        try { resetIntentEditBaseline(intent); } catch (e) {}
      }
      try { dismissedHashes.delete(CLINICAL_ID); } catch (e) {}
      try { selectedNodeId = null; } catch (e) {}
      try { render(); } catch (e) {}
    }

    async function waitFor(sel, tries = 40) {
      for (let i = 0; i < tries; i++) {
        const el = $(sel);
        if (el && el.getBoundingClientRect().width > 0) return el;
        await sleep(50);
      }
      return null;
    }

    async function whileVisible() {
      while (document.hidden) await sleep(300);
    }

    async function runOnce() {
      resetState();
      await sleep(t(1300));

      // 2. Hover the "Medical → AI call" node, then click it.
      const node = $('.flow-node[data-node-id="intent-' + CLINICAL_ID + '"]');
      if (!(await hoverTap(node, t(650)))) return;

      // 3. Editor opens — add custom instructions, then dismiss the banner.
      const ta = await waitFor('#prompt-textarea');
      if (!ta) return;
      await moveTo(ta);
      await sleep(t(180));
      await typeInto(ta, INSTRUCTION);
      await sleep(t(1300));
      const dismiss = await waitFor('.prose-warning-dismiss', 20);
      if (dismiss) { await tap(dismiss); await sleep(t(700)); }

      // 4. Hover the Preview button, then click it.
      if (!(await hoverTap(await waitFor('#panel-preview-btn'), t(900)))) return;
      await waitFor('#preview-panel:not(.hidden)', 20);
      await sleep(t(1700));

      // 5. Close preview pane, then the editor panel.
      await tap(await waitFor('#preview-close', 20));
      await sleep(t(620));
      await tap(await waitFor('#panel-close', 20));
      await sleep(t(1100));
    }

    async function loop() {
      placeCursorAtCenter();
      await sleep(t(400));
      while (true) {
        await whileVisible();
        try { await runOnce(); }
        catch (e) { /* keep the hero alive on any hiccup */ }
        await sleep(t(500));
      }
    }

    function start() {
      document.body.appendChild(shield);
      document.body.appendChild(cursor);
      // Let the prototype's own deferred init settle first.
      setTimeout(loop, 600);
    }

    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
  })();
  </script>

</body>
